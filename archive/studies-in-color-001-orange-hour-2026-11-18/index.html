(()=>{'use strict';const canvas=document.querySelector('#painting'),ctx=canvas.getContext('2d',{alpha:false});const layer=document.createElement('canvas'),lc=layer.getContext('2d');const grain=document.createElement('canvas'),gc=grain.getContext('2d');let width,height,scale=1,phase=0,last=0,frame=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;let pointer={x:0,y:0},drift={x:0,y:0};let seed=1126;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};grain.width=256;grain.height=256;let pixels=gc.createImageData(256,256);for(let i=0;i<pixels.data.length;i+=4){const v=rand();pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=v>.5?255:15;pixels.data[i+3]=Math.floor(9+rand()*30)}gc.putImageData(pixels,0,0);

function shape(p,i,t){let [x,y,rx,ry,rot,blur,color]=p;const d=Math.sin(t*.34+i*1.71), e=Math.cos(t*.29+i*1.27); x+=d*.018+drift.x*(.012+(i%3)*.009);y+=e*.022+drift.y*.018;const px=x*width,py=y*height;lc.save();lc.translate(px,py);lc.rotate(rot+d*.055);lc.scale(rx*width,ry*height);lc.beginPath();lc.moveTo(-.96,.02);lc.bezierCurveTo(-1.10,-.55,-.40,-1.07,.16,-.99);lc.bezierCurveTo(.74,-.93,1.12,-.51,.99,.07);lc.bezierCurveTo(.92,.52,.42,1.15,-.13,.95);lc.bezierCurveTo(-.71,.79,-.94,.40,-.96,.02);lc.closePath();lc.restore();lc.filter=`blur(${blur*scale}px)`;lc.fillStyle=color;lc.fill();lc.filter='none'}
function render(t){lc.fillStyle='#dcd2cb';lc.fillRect(0,0,width,height);pigments.forEach((p,i)=>shape(p,i,t));ctx.drawImage(layer,0,0); // pigment detail: a fine, almost handwritten line, like a mark in a sketchbook
const portrait=width/height<1;const a=portrait?.38:.38,b=portrait?.41:.37;ctx.save();ctx.translate(width*a,height*b);ctx.scale(Math.min(width,height)*.33,Math.min(width,height)*.33);ctx.rotate(-.17);ctx.beginPath();ctx.moveTo(-.45,.12);ctx.bezierCurveTo(-.68,-.34,.12,-.85,.38,-.48);ctx.bezierCurveTo(.65,-.08,.05,.7,-.30,.64);ctx.bezierCurveTo(-.66,.57,-.35,-.15,.19,-.10);ctx.bezierCurveTo(.49,-.07,.62,.14,.83,.09);ctx.lineWidth=.004;ctx.strokeStyle='rgba(248,224,188,.64)';ctx.stroke();ctx.restore();ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle=ctx.createPattern(grain,'repeat');ctx.fillRect(0,0,width,height);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.17;ctx.fillStyle=ctx.createPattern(grain,'repeat');ctx.fillRect(0,0,width,height);ctx.restore()}
function resize(){const r=canvas.getBoundingClientRect();const ratio=Math.min(devicePixelRatio||1,1.45,1050/r.width,1050/r.height);width=Math.max(1,Math.round(r.width*ratio));height=Math.max(1,Math.round(r.height*ratio));canvas.width=layer.width=width;canvas.height=layer.height=height;scale=Math.min(width,height)/550;render(phase)}
function tick(now){if(paused){frame=0;return}if(!last)last=now;phase+=Math.min((now-last)/1000,.06);last=now;drift.x+=(pointer.x-drift.x)*.028;drift.y+=(pointer.y-drift.y)*.028;render(phase);frame=requestAnimationFrame(tick)}
