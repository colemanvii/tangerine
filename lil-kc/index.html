<meta name="claude:viewport-fit-sides" content="cover">
<title>Lil KC Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a viewing room. One quiet bar, then the picture as large as it will go. Square edges, no gradients. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --fg:#1d2124; --muted:#5c656c; --rule:#cdd3d7;
  --accent:#e8590c; --accent-fg:#ffffff; --paper:#fcdfba; --ok:#1f7a4a; --no:#8a3a2a;
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141719; --panel:#1d2124; --fg:#eceff1; --muted:#9aa4ab; --rule:#3a4146;
  --accent:#ff7a2e; --accent-fg:#141719; --ok:#5fcf95; --no:#e39a86; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141719; --panel:#1d2124; --fg:#eceff1; --muted:#9aa4ab; --rule:#3a4146;
  --accent:#ff7a2e; --accent-fg:#141719; --ok:#5fcf95; --no:#e39a86; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:clamp(24px,3.4vw,34px);font-weight:700;line-height:1.1}
h3{font-size:15px;font-weight:600}
p{margin:0;max-width:66ch}
.label{font:500 11px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--fg);padding-bottom:14px}
.brand{display:flex;align-items:baseline;gap:12px}
nav{display:flex;gap:4px}
nav a{font:600 14px var(--display);color:var(--muted);text-decoration:none;padding:6px 12px;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}

.view{display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end;justify-content:space-between}
.head > div{display:flex;flex-direction:column;gap:4px;min-width:0}

.stage{position:relative;width:100%;max-width:100%;aspect-ratio:3/2;background:var(--paper);border:1.5px solid var(--fg);overflow:hidden}
.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none}
.stage.big{max-height:76vh;margin:0 auto}
.tag{position:absolute;left:0;top:0;background:var(--fg);color:var(--bg);font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px}

.transport{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.seg{display:flex;border:1.5px solid var(--fg)}
.seg button{background:transparent;border:0;border-right:1.5px solid var(--fg);padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.scrub{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=range]{accent-color:var(--accent);width:100%}
select{font:500 14px var(--body);color:var(--fg);background:var(--panel);border:1.5px solid var(--fg);padding:7px 10px;max-width:100%}

.chip{display:inline-flex;align-items:center;gap:7px;font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;border:1.5px solid currentColor;padding:4px 8px;color:var(--muted);white-space:nowrap}
.chip i{width:8px;height:8px;background:currentColor;display:block}
.chip.approved{color:var(--ok)} .chip.not-approved{color:var(--no)} .chip.under-review{color:var(--accent)}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--panel);border:1.5px solid var(--rule);padding:8px;cursor:pointer;min-width:0}
.card[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 -4px 0 var(--accent)}
.card .stage{border-width:1px;border-color:var(--rule)}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.card small{color:var(--muted);font-size:12.5px}

.detail{display:grid;grid-template-columns:1.2fr 1fr;gap:26px}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.detail > div{display:flex;flex-direction:column;gap:10px;min-width:0}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:13.5px}
.decide{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pending{border-left:3px solid var(--accent);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.pending code{font:400 12.5px var(--mono);background:var(--panel);border:1px solid var(--rule);padding:6px 8px;display:block;overflow-wrap:anywhere;user-select:all}
.btn{background:var(--fg);color:var(--bg);border:0;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;align-self:flex-start}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.pair{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font:400 12.5px var(--mono)}
.facts span{overflow-wrap:anywhere;min-width:0}
</style>

<div class="wrap">
  <div class="bar">
    <div class="brand"><h1>Lil KC</h1><span class="label">Animation library</span></div>
    <nav aria-label="Library sections">
      <a href="#master" data-v="master">Master</a>
      <a href="#takes" data-v="takes">Takes</a>
      <a href="#compare" data-v="compare">Compare</a>
    </nav>
  </div>

  <section class="view" id="v-master" hidden>
    <div class="head">
      <div><span class="label">The original · never altered</span><h2>Master artwork</h2></div>
      <span class="chip approved"><i></i>Canonical</span>
    </div>
    <div class="stage big"><img id="m-img" alt="Lil KC master artwork: a small boy with a huge afro and red bandanna in a flying kick, dagger forward, holding a red heart close"></div>
    <div class="facts" id="m-facts"></div>
  </section>

  <section class="view" id="v-takes" hidden>
    <div class="head">
      <div><span class="label" id="t-kicker"></span><h2 id="t-title"></h2></div>
      <span id="t-chip"></span>
    </div>
    <div class="stage big" id="t-stage"></div>
    <div class="transport" id="t-transport"></div>
    <div class="detail">
      <div>
        <h3>Decision</h3>
        <div class="decide">
          <div class="seg" id="t-decide">
            <button data-v="approved">Approve</button>
            <button data-v="under review">Keep reviewing</button>
            <button data-v="not approved">Not approved</button>
          </div>
        </div>
        <p class="label" id="t-record"></p>
        <div class="pending" id="t-pending" hidden>
          <span>Your choice is saved in this browser only. To make it the record, send this line to Claude or put it in <b>takes.js</b>:</span>
          <code id="t-line"></code>
          <button class="btn" id="t-copy">Copy</button>
        </div>
      </div>
      <div>
        <h3>Where it came from</h3>
        <div class="facts" id="t-facts"></div>
        <ul id="t-prov"></ul>
      </div>
    </div>
    <div class="head"><div><span class="label">All takes</span></div></div>
    <div class="shelf" id="shelf"></div>
  </section>

  <section class="view" id="v-compare" hidden>
    <div class="head">
      <div><span class="label">Two at once</span><h2>Compare</h2></div>
    </div>
    <div class="pair">
      <div class="side"><select id="c-a" aria-label="Left picture"></select><div class="stage" id="c-sa"></div></div>
      <div class="side"><select id="c-b" aria-label="Right picture"></select><div class="stage" id="c-sb"></div></div>
    </div>
    <div class="transport" id="c-transport"></div>
  </section>
</div>

<script src="takes.js"></script>
<script>
(function(){
  var LIB = window.KC_LIBRARY, $ = function(id){return document.getElementById(id)};
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STORE = 'lil-kc-library-decisions';
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function loadLocal(){ try{ return JSON.parse(localStorage.getItem(STORE)||'{}') }catch(e){ return {} } }
  function saveLocal(d){ try{ localStorage.setItem(STORE, JSON.stringify(d)) }catch(e){} }
  var local = loadLocal();
  function statusOf(t){ return (local[t.id] && local[t.id].status) || t.status }
  function chip(status){ return '<span class="chip '+status.replace(/ /g,'-')+'"><i></i>'+esc(status)+'</span>' }
  function frameSrc(t, i){ return t.path.replace('%04d', ('000'+(i+1)).slice(-4)) }
  function takeById(id){ return LIB.takes.filter(function(t){return t.id===id})[0] }

  // ---- one player for every kind of picture --------------------------------
  function Player(stage, item){
    var self=this; this.item=item; this.playing=false; this.u=0; this.onTick=null;
    stage.innerHTML='';
    if(item.kind==='frames'){
      this.n=item.frames; this.dur=item.frames/item.fps;
      this.cache=[]; for(var i=0;i<item.frames;i++){ var im=new Image(); im.src=frameSrc(item,i); this.cache.push(im) }
      this.el=document.createElement('img'); this.el.alt=item.title+' '+(item.subtitle||''); stage.appendChild(this.el);
    } else if(item.kind==='video'){
      this.el=document.createElement('video'); this.el.src=item.path; this.el.loop=true; this.el.muted=true; this.el.playsInline=true;
      this.el.setAttribute('aria-label', item.title); stage.appendChild(this.el);
      this.el.addEventListener('timeupdate', function(){ if(self.el.duration){ self.u=self.el.currentTime/self.el.duration; self.onTick&&self.onTick() } });
    } else {
      this.el=document.createElement('img'); this.el.src=item.path; this.el.alt=item.title; stage.appendChild(this.el);
    }
    this.speed=1; this.show();
  }
  Player.prototype.canScrub=function(){ return this.item.kind==='frames'||this.item.kind==='video' };
  Player.prototype.show=function(){
    if(this.item.kind==='frames'){ this.el.src=frameSrc(this.item, Math.min(this.n-1, Math.floor(this.u*this.n))) }
    this.onTick&&this.onTick();
  };
  Player.prototype.seek=function(u){ this.u=((u%1)+1)%1;
    if(this.item.kind==='video' && this.el.duration) this.el.currentTime=this.u*this.el.duration;
    this.show() };
  Player.prototype.step=function(d){ this.pause();
    var n=this.item.kind==='frames'?this.n:Math.max(1,Math.round((this.el.duration||1)*(this.item.fps||24)));
    this.seek((Math.round(this.u*n)+d+0.001)/n) };
  Player.prototype.play=function(){ var self=this; if(this.playing) return; this.playing=true;
    if(this.item.kind==='video'){ this.el.playbackRate=this.speed; var p=this.el.play(); if(p&&p.catch) p.catch(function(){}) }
    if(this.item.kind==='frames'){
      this.timer=setInterval(function(){ self.u=(Math.floor(self.u*self.n)+1)%self.n/self.n; self.show() }, 1000/(this.item.fps*this.speed));
    } };
  Player.prototype.pause=function(){ this.playing=false; clearInterval(this.timer); if(this.item.kind==='video') this.el.pause() };
  Player.prototype.setSpeed=function(s){ this.speed=s; if(this.playing){ this.pause(); this.play() } };
  Player.prototype.label=function(){
    if(this.item.kind==='frames') return 'Drawing '+(Math.min(this.n-1,Math.floor(this.u*this.n))+1)+' of '+this.n;
    if(this.item.kind==='video') return (this.u*(this.el.duration||0)).toFixed(2)+' s';
    return this.item.kind==='still' ? 'Still' : 'Plays on its own';
  };

  function transport(box, players){
    box.innerHTML='<div class="seg"><button data-a="prev" aria-label="Step back">◀</button><button data-a="play" aria-pressed="false">Play</button><button data-a="next" aria-label="Step forward">▶</button></div>'+
      '<div class="seg" data-speed><button data-s="1" aria-pressed="true">Full speed</button><button data-s="0.5">Half</button><button data-s="0.25">Quarter</button></div>'+
      '<div class="scrub"><label class="label" for="'+box.id+'-r"></label><input type="range" id="'+box.id+'-r" min="0" max="1000" value="0"></div>';
    var playBtn=box.querySelector('[data-a=play]'), range=box.querySelector('input'), lab=box.querySelector('label');
    var live=players.filter(function(p){return p.canScrub()});
    function ui(){ var on=live.some(function(p){return p.playing}); playBtn.textContent=on?'Pause':'Play'; playBtn.setAttribute('aria-pressed', on);
      if(live[0]){ range.value=Math.round(live[0].u*1000) } lab.textContent=players.map(function(p){return p.label()}).join('   ·   ') }
    players.forEach(function(p){p.onTick=ui});
    box.onclick=function(e){ var b=e.target.closest('button'); if(!b) return;
      if(b.dataset.a==='play'){ var on=live.some(function(p){return p.playing}); live.forEach(function(p){ on?p.pause():p.play() }) }
      if(b.dataset.a==='prev') live.forEach(function(p){p.step(-1)});
      if(b.dataset.a==='next') live.forEach(function(p){p.step(1)});
      if(b.dataset.s){ live.forEach(function(p){p.setSpeed(+b.dataset.s)});
        [].forEach.call(box.querySelectorAll('[data-s]'), function(x){x.setAttribute('aria-pressed', x===b)}) }
      ui() };
    range.oninput=function(){ live.forEach(function(p){p.pause(); p.seek(range.value/1000)}); ui() };
    box.hidden = live.length===0;
    if(!REDUCED) live.forEach(function(p){p.play()});
    ui();
  }

  var MASTER_ITEM={id:'master', kind:'still', title:'Master artwork', path:LIB.master.file};
  var active=[]; function stopAll(){ active.forEach(function(p){p.pause()}); active=[] }

  // ---- master ---------------------------------------------------------------
  $('m-img').src=LIB.master.file;
  $('m-facts').innerHTML=['Archived '+LIB.master.archived, LIB.master.size.join(' × ')+' px', LIB.master.file, 'SHA-256 '+LIB.master.sha256.slice(0,16)+'…']
    .map(function(s){return '<span>'+esc(s)+'</span>'}).join('');

  // ---- takes ----------------------------------------------------------------
  var current = LIB.takes[0] && LIB.takes[0].id;
  function shelf(){
    $('shelf').innerHTML='';
    LIB.takes.forEach(function(t){
      var b=document.createElement('button'); b.className='card'; b.type='button'; b.setAttribute('aria-pressed', t.id===current);
      var poster = t.kind==='frames' ? frameSrc(t,(t.poster||1)-1) : (t.poster||'');
      b.innerHTML='<div class="stage">'+(poster?'<img alt="" src="'+esc(poster)+'">':'')+'</div><div class="row"><h3>'+esc(t.title)+'</h3>'+chip(statusOf(t))+'</div><small>'+esc(t.subtitle||'')+'<br>'+esc(t.made_with||'')+'</small>';
      b.onclick=function(){ current=t.id; showTake() };
      $('shelf').appendChild(b);
    });
  }
  function showTake(){
    stopAll();
    var t=takeById(current); if(!t){ $('t-title').textContent='No takes yet'; return }
    $('t-kicker').textContent=(t.subtitle||'')+' · '+t.date;
    $('t-title').textContent=t.title;
    $('t-chip').innerHTML=chip(statusOf(t));
    var p=new Player($('t-stage'), t); active=[p]; transport($('t-transport'), [p]);
    $('t-facts').innerHTML=[t.made_with, t.kind==='frames'?(t.frames+' drawings at '+t.fps+' per second'):t.kind, t.id]
      .filter(Boolean).map(function(s){return '<span>'+esc(s)+'</span>'}).join('');
    $('t-prov').innerHTML=(t.provenance||[]).map(function(s){return '<li>'+esc(s)+'</li>'}).join('');
    decision(t); shelf();
  }
  function decision(t){
    var st=statusOf(t), mine=local[t.id];
    [].forEach.call($('t-decide').querySelectorAll('button'), function(b){b.setAttribute('aria-pressed', b.dataset.v===st)});
    $('t-record').textContent='On record: '+t.status+(t.decision&&t.decision.date?' · '+t.decision.date:'');
    var pending = mine && mine.status!==t.status;
    $('t-pending').hidden=!pending;
    if(pending) $('t-line').textContent=t.id+': '+mine.status+' ('+mine.date+')';
  }
  $('t-decide').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; var t=takeById(current); if(!t) return;
    local[t.id]={status:b.dataset.v, date:new Date().toISOString().slice(0,10)}; saveLocal(local);
    $('t-chip').innerHTML=chip(statusOf(t)); decision(t); shelf() };
  $('t-copy').onclick=function(){ var txt=$('t-line').textContent, btn=this;
    var done=function(){ btn.textContent='Copied'; setTimeout(function(){btn.textContent='Copy'},1500) };
    try{ navigator.clipboard.writeText(txt).then(done, sel) }catch(e){ sel() }
    function sel(){ var r=document.createRange(); r.selectNodeContents($('t-line')); var s=getSelection(); s.removeAllRanges(); s.addRange(r) } };

  // ---- compare --------------------------------------------------------------
  var items=[MASTER_ITEM].concat(LIB.takes);
  ['c-a','c-b'].forEach(function(id,i){
    $(id).innerHTML=items.map(function(t){return '<option value="'+esc(t.id)+'">'+esc(t.title+(t.subtitle?' · '+t.subtitle:''))+'</option>'}).join('');
    $(id).value = i===0 ? (LIB.takes[0]?LIB.takes[0].id:'master') : (LIB.takes[1]?LIB.takes[1].id:'master');
    $(id).onchange=showCompare;
  });
  function showCompare(){
    stopAll();
    var pick=function(id){ return id==='master'?MASTER_ITEM:takeById(id) };
    var a=new Player($('c-sa'), pick($('c-a').value)), b=new Player($('c-sb'), pick($('c-b').value));
    active=[a,b]; transport($('c-transport'), [a,b]);
  }

  // ---- views ------------------------------------------------------------------
  function route(){
    var v=(location.hash||'#takes').slice(1); if(['master','takes','compare'].indexOf(v)<0) v='takes';
    stopAll();
    ['master','takes','compare'].forEach(function(n){ $('v-'+n).hidden = n!==v });
    [].forEach.call(document.querySelectorAll('nav a'), function(a){ a.dataset.v===v ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current') });
    if(v==='takes') showTake();
    if(v==='compare') showCompare();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
