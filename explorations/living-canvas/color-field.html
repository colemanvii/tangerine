<script>
(function () {
  'use strict';
  const T = Tangerine, canvas = document.getElementById('field');

  /* ----- The collection -----
     One painting a day, numbered from No. 001 (18 November 2026). Every visitor
     sees the same painting on the same day; it is never still.

     THE RULES
     1. A ground and three fields. Nothing else.
     2. Tangerine is always present, and always large.
     3. Four ways to stand: stacked, nested, drifting, horizon.
     4. Most days, one field is a counterweight: a deep note or a cool one.
     5. Neighbours never come from the same family.
     6. One day in nine the ground is dark.
     7. The paint keeps moving: edges wander, hues drift, it leans toward you. */
  const C = {
    cream: '#efe5d3', bone: '#f3ead9', paper: '#ece0cb',
    tangerine: '#ee7a2c', marigold: '#f29a3b', vermilion: '#d63c22', scarlet: '#c9301f',
    pink: '#f1c4ba', blush: '#ebb1a6', ochre: '#dea43f',
    green: '#2f5a3d', deep: '#1e3527', plum: '#5f2a3c', ultramarine: '#2c3d8f', ink: '#22304f', graphite: '#2c2a27',
    sky: '#b9cad6', sage: '#a9b89a', mist: '#cdd3d3'
  };
  const NAMES = { cream: 'cream', bone: 'bone', paper: 'paper', tangerine: 'tangerine', marigold: 'marigold', vermilion: 'vermilion',
    scarlet: 'scarlet', pink: 'pale pink', blush: 'blush', ochre: 'ochre', green: 'botanical green', deep: 'deep green', plum: 'plum',
    ultramarine: 'ultramarine', ink: 'ink blue', graphite: 'graphite', sky: 'sky', sage: 'sage', mist: 'mist' };
  const WARM = ['marigold', 'vermilion', 'scarlet', 'pink', 'blush', 'ochre'];
  const DEEP = ['green', 'deep', 'plum', 'ultramarine', 'ink', 'graphite'];
  const COOL = ['sky', 'sage', 'mist'];
  const FAMILY = { tangerine: 'orange', marigold: 'orange', ochre: 'orange', vermilion: 'red', scarlet: 'red', pink: 'pink', blush: 'pink',
    green: 'green', deep: 'green', sage: 'green', plum: 'violet', ultramarine: 'blue', ink: 'blue', sky: 'blue', mist: 'blue', graphite: 'grey' };
  // For each form: where tangerine may go, and where a counterweight may go.
  const SLOTS = { stack: { t: [0, 2], note: [0, 1, 2] }, nested: { t: [1, 0], note: [2, 0, 2] }, drift: { t: [0, 1], note: [1, 2, 2] }, horizon: { t: [1, 0], note: [0, 2, 2] } };

  function painting(n) {
    const r = T.rng(n * 7919 + 101), pick = a => a[Math.floor(r() * a.length)];
    // every four days, each form once, in an order of their own
    const block = Math.floor((n - 1) / 4), order = ['stack', 'nested', 'drift', 'horizon'];
    for (let i = 3; i > 0; i--) { const j = Math.floor(T.hash(block * 4 + i + 9) * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const form = order[(n - 1) % 4];
    const darkGround = T.hash(n * 5 + 3) < 1 / 9;
    const ground = darkGround ? pick(['deep', 'graphite', 'ink']) : pick(['cream', 'bone', 'paper']);
    const slots = [null, null, null];
    const tAt = pick(SLOTS[form].t); slots[tAt] = 'tangerine';
    const roll = r();
    const noteKind = darkGround ? (roll < 0.4 ? COOL : null) : roll < 0.45 ? DEEP : roll < 0.75 ? COOL : null;
    if (noteKind) {
      const open = SLOTS[form].note.filter(i => slots[i] === null), at = open.length ? pick(open) : undefined;
      if (at !== undefined) slots[at] = pick(noteKind.filter(c => FAMILY[c] !== FAMILY[ground] && c !== ground));
    }
    for (let i = 0; i < 3; i++) {
      if (slots[i]) continue;
      const near = [slots[i - 1], slots[i + 1]].filter(Boolean).map(c => FAMILY[c]);
      const pool = WARM.filter(c => !near.includes(FAMILY[c]) && !slots.includes(c));
      slots[i] = pick(pool.length ? pool : WARM);
    }
    const list = slots.map(c => NAMES[c]);
    const caption = list[0][0].toUpperCase() + list[0].slice(1) + ', ' + list[1] + ' and ' + list[2] + ' on ' + NAMES[ground];
    return { form, ground: C[ground], text: darkGround ? '#efe5d3' : '#1d1a16', fields: slots.map(c => C[c]), caption };
  }

  const params = new URLSearchParams(location.search);
  const today = T.edition();
  let no = params.has('no') ? Math.max(1, parseInt(params.get('no'), 10) || 1) : today;
  const last = Math.max(today, no);
  let study = null, rnd = null, fields = [], seed = 0, rectsPx = [];
  const label = document.getElementById('label');

  /* ----- Composition -----
     Rectangles in CSS pixels (x0, y0 top, x1, y1 bottom) inside a frame that
     leaves room below for the signature. The shader makes them paint. */
  function compose(W, H) {
    const portrait = H > W * 1.05;
    const mx = Math.round(Math.max(20, Math.min(W * 0.058, 92)));
    const wm = Math.round(Math.max(150, Math.min(W * (portrait ? 0.44 : 0.165), 290)));
    const sig = Math.max(wm * 0.165, 30);
    const mb = Math.round(mx * (portrait ? 1.0 : 0.9));
    const top = Math.round(mx * (portrait ? 1.25 : 1)) + 22;   // room for the label
    const bottom = H - mb - sig - Math.round(mx * (portrait ? 1.0 : 0.85));
    const f = { x0: mx, x1: W - mx, y0: top, y1: bottom };
    const fw = f.x1 - f.x0, fh = f.y1 - f.y0;
    const R = (a, b, c, d) => [f.x0 + a * fw, f.y0 + b * fh, f.x0 + c * fw, f.y0 + d * fh];
    let rects;
    switch (study.form) {
      case 'stack':
        rects = portrait
          ? [R(0.02, 0.0, 0.98, 0.5), R(0.04, 0.545, 0.96, 0.6), R(0.02, 0.645, 0.98, 1)]
          : [R(0.015, 0.0, 0.985, 0.54), R(0.03, 0.59, 0.97, 0.655), R(0.015, 0.705, 0.985, 1)];
        break;
      case 'nested': {
        // Homage to a homage: squares sharing a centre line, sinking toward the bottom.
        const s = Math.min(fw, fh) * (portrait ? 1 : 1.0);
        const cx = f.x0 + fw * (portrait ? 0.5 : 0.5), by = portrait ? f.y0 + fh * 0.5 + s / 2 : f.y1;
        const sq = (k, lift) => [cx - s * k / 2, by - s * lift - s * k, cx + s * k / 2, by - s * lift];
        rects = [sq(1, 0), sq(0.72, 0.075), sq(0.44, 0.15)];
        break;
      }
      case 'drift':
        rects = portrait
          ? [R(0, 0, 1, 0.6), R(0.24, 0.47, 1, 0.86), R(0.06, 0.9, 0.3, 0.97)]
          : [R(0, 0, 0.64, 1), R(0.5, 0.14, 1, 0.7), R(0.8, 0.8, 0.93, 0.9)];
        break;
      case 'horizon':
        rects = portrait
          ? [R(0, 0, 1, 0.72), R(0, 0.76, 1, 1), R(0.6, 0.58, 0.78, 0.68)]
          : [R(0, 0, 1, 0.7), R(0, 0.745, 1, 1), R(0.66, 0.5, 0.75, 0.62)];
        break;
    }
    document.documentElement.style.setProperty('--mx', mx + 'px');
    document.documentElement.style.setProperty('--mb', mb + 'px');
    document.documentElement.style.setProperty('--wm', wm + 'px');
    return rects;
  }

  /* ----- Colour helpers: drift each field between two neighbouring hues ----- */
  function hexToHsl(hex) {
    const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
    if (max === min) return [0, 0, l];
    const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h / 6, s, l];
  }
  function hslToLin(h, s, l) {
    const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return [f(0), f(8), f(4)].map(v => Math.pow(Math.min(1, Math.max(0, v)), 2.2));
  }
  function makeFields() {
    return study.fields.map((hex, i) => {
      const [h, s, l] = hexToHsl(hex);
      const dir = rnd() < 0.5 ? -1 : 1;
      return {
        a: [h, s, l], b: [h + dir * (0.012 + rnd() * 0.012), s * (0.94 + rnd() * 0.1), l + (rnd() - 0.5) * 0.06],
        period: 220 + rnd() * 200, phase: rnd() * 6.28,
        edges: [0, 1, 2, 3].map(() => ({ p: 70 + rnd() * 90, ph: rnd() * 6.28 })),
        soft: [0.011, 0.0085, 0.008][i] * (0.85 + rnd() * 0.4),
        rough: 0.8 + rnd() * 0.45,
        cover: 0.97,
        // the stain beneath: a little redder (or greener, for green) and deeper
        uh: (h > 0.2 && h < 0.5) ? 0.02 : -0.022, ul: l > 0.7 ? 0.86 : 0.74
      };
    });
  }
  // Hang painting number n.
  function hang(n) {
    no = n; study = painting(n); seed = n * 7919 + 13; rnd = T.rng(seed);
    fields = makeFields();
    const root = document.documentElement.style;
    root.setProperty('--ground', study.ground);
    root.setProperty('--text', study.text);
    document.querySelector('meta[name=theme-color]').content = study.ground;
    label.textContent = 'No. ' + T.pad3(n) + ' · ' + study.caption;
    if (W) rectsPx = compose(W, H);
  }
  let W = 0, H = 0;
  hang(no);

  /* ----- Rendering ----- */
  const gl = T.gl(canvas);
  if (!gl) { // No WebGL: a still, flat version of the study.
    document.body.classList.add('is-ready');
    canvas.replaceWith(Object.assign(document.createElement('div'), { className: 'stage' }));
    return;
  }

  const PAINT = T.glslNoise + `
uniform vec2 uRes; uniform float uTime, uSeed;
uniform vec3 uGround;
uniform vec4 uRect[3]; uniform vec3 uCol[3]; uniform vec3 uUnder[3]; uniform vec4 uPar[3];
uniform vec3 uPointer;
varying vec2 vUv;

float boxSD(vec2 q,vec2 hs){vec2 d=abs(q)-hs;return length(max(d,0.))+min(max(d.x,d.y),0.);}

void main(){
  float asp=uRes.x/uRes.y;
  vec2 p=vec2(vUv.x*asp,vUv.y);
  float t=uTime;
  // the whole surface breathes very slightly
  vec2 w=vec2(fbm3(p*1.3+uSeed+t*.006),fbm3(p*1.3-uSeed-t*.005))-.5;
  p+=w*.018;
  // a visitor's presence draws the paint a little toward them
  vec2 toP=uPointer.xy-p; float dp=length(toP);
  p+=toP*uPointer.z*.07*exp(-dp*dp*10.);

  // ground: primed canvas, a little uneven
  float gt=fbm(p*2.6+uSeed*.3);
  vec3 col=uGround*(.955+.09*gt);

  for(int i=0;i<3;i++){
    float k=float(i)*3.17+uSeed;
    vec4 r=uRect[i]; vec4 par=uPar[i];
    vec2 c=(r.xy+r.zw)*.5, hs=(r.zw-r.xy)*.5;
    float sd=boxSD(p-c,hs);
    if(sd>.1) continue;                      // nothing of this field reaches here
    // the boundary is negotiated, not drawn: a slow wander, a cloudy irregularity,
    // and a faint drag along the direction of the brush
    sd+=(fbm(p*1.7+k+vec2(t*.009,-t*.007))-.5)*.034*par.y;
    sd+=(fbm3(p*7.5+k*2.1+t*.004)-.5)*.02*par.y;
    sd+=(fbm3(vec2(p.x*1.6,p.y*19.)+k*5.3)-.5)*.018*par.y;
    float soft=par.x*(.55+.9*fbm3(p*2.2+k*1.3+t*.005));

    // underpainting: a warmer, deeper stain that shows as a halo at the edge
    vec3 under=uUnder[i];
    float halo=1.-smoothstep(-soft*1.2,soft*1.4+.004,sd-.0035);
    col=mix(col,mix(under,uCol[i],.35),halo*.4*par.z);

    // the field itself: mottled, scumbled, brushed across
    float cloud=fbm(p*2.+k*7.3+t*.006);
    float cloud2=fbm3(p*5.5-k*2.+t*.004);
    vec3 cc=mix(uCol[i],under,smoothstep(.5,.85,cloud)*.42);
    cc*=mix(.94,1.07,cloud2);
    float strokes=fbm3(vec2(p.x*1.4+cloud*1.5,p.y*26.)+k*4.);
    cc*=1.+(strokes-.5)*.09;
    float m=1.-smoothstep(-soft,soft*.8,sd);
    float cover=par.z*mix(.86,1.,smoothstep(.3,.7,fbm3(p*3.5+k*3.)));
    col=mix(col,cc,m*cover);
  }
  gl_FragColor=vec4(toSrgb(col),1.);
}`;

  const PRINT = T.glslNoise + T.glslGrain + `
uniform sampler2D uTex; uniform vec2 uRes; uniform float uSeed;
varying vec2 vUv;
void main(){
  vec2 px=gl_FragCoord.xy;
  vec3 c=texture2D(uTex,vUv).rgb;
  // canvas tooth: a fine weave that catches the paint
  float weave=(sin(px.x*1.9)*sin(px.y*1.9))*.5;
  float tooth=(vnoise(px*.42)-.5)*.9+weave*.25;
  c+=tooth*.012;
  c=applyGrain(c,px,uSeed,.075);
  gl_FragColor=vec4(c,1.);
}`;

  const paint = T.program(gl, PAINT), print = T.program(gl, PRINT);
  let dpr = 1, lowW = 0, lowH = 0, target = null;
  let presence = 0, loop = null;

  T.onResize((w, h, d) => {
    W = w; H = h; dpr = d;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const s = Math.min(1, 1000 / Math.max(W, H));
    lowW = Math.round(W * s); lowH = Math.round(H * s);
    target = T.target(gl, lowW, lowH, target);
    rectsPx = compose(W, H);
    if (loop) render(loop.time);
  });

  const rects = new Float32Array(12), cols = new Float32Array(9), unders = new Float32Array(9), pars = new Float32Array(12);
  function render(t) {
    // rectangles: each edge drifts on its own long period
    rectsPx.forEach((r, i) => {
      const f = fields[i], amp = Math.min(W, H) * 0.012;
      const e = f.edges.map(x => Math.sin(t * 6.283 / x.p + x.ph) * amp);
      rects[i * 4] = (r[0] + e[0]) / H; rects[i * 4 + 1] = 1 - (r[3] + e[3]) / H;
      rects[i * 4 + 2] = (r[2] + e[2]) / H; rects[i * 4 + 3] = 1 - (r[1] + e[1]) / H;
      const k = 0.5 + 0.5 * Math.sin(t * 6.283 / f.period + f.phase);
      const h = f.a[0] + (f.b[0] - f.a[0]) * k, sat = f.a[1] + (f.b[1] - f.a[1]) * k, l = f.a[2] + (f.b[2] - f.a[2]) * k;
      cols.set(hslToLin(h, sat, l), i * 3);
      unders.set(hslToLin(h + f.uh, Math.min(1, sat * 1.08), l * f.ul), i * 3);
      pars.set([f.soft, f.rough, f.cover, 0], i * 4);
    });
    gl.useProgram(paint);
    gl.uniform2f(paint.u('uRes'), lowW, lowH);
    gl.uniform1f(paint.u('uTime'), t);
    gl.uniform1f(paint.u('uSeed'), (seed % 1000) / 37);
    gl.uniform3fv(paint.u('uGround'), T.hexToLin(study.ground));
    gl.uniform4fv(paint.u('uRect'), rects);
    gl.uniform3fv(paint.u('uCol'), cols);
    gl.uniform3fv(paint.u('uUnder'), unders);
    gl.uniform4fv(paint.u('uPar'), pars);
    const P = T.pointer;
    gl.uniform3f(paint.u('uPointer'), P.sx * W / H, 1 - P.sy, T.reduced() ? 0 : presence);
    T.draw(gl, paint, target, lowW, lowH);

    gl.useProgram(print);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, target.tex);
    gl.uniform1i(print.u('uTex'), 0);
    gl.uniform2f(print.u('uRes'), canvas.width, canvas.height);
    gl.uniform1f(print.u('uSeed'), (seed % 97) + 0.5);
    T.draw(gl, print, null, canvas.width, canvas.height);
  }

  const startAt = T.hash(no + 77) * 900 + (Date.now() / 1000) % 600;
  loop = T.loop((t, dt) => {
    T.pointer.step(dt, 1.6);
    const want = T.pointer.inside ? 0.35 + T.pointer.stir * 0.65 : 0;
    presence += (want - presence) * (1 - Math.exp(-dt / 1.8));
    render(t);
  }, { offset: startAt, maxFps: 30 });

  function setMotion() { if (T.reduced()) { loop.stop(); render(loop.time); } else loop.start(); }
  T.onMotionChange(setMotion);
  setMotion();
  render(loop.time);
  document.body.classList.add('is-ready');

  const room = T.room({
    trigger: document.getElementById('enter'),
    onEnter() { loop.fps(20); }, onLeave() { loop.fps(30); }
  });

  /* The collection: ← → (or a swipe) walks back through earlier days. */
  let turning = false;
  function turn(n) {
    n = Math.min(last, Math.max(1, n));
    if (n === no || turning) return;
    if (T.reduced()) { hang(n); render(loop.time); return; }
    turning = true; document.body.classList.add('is-turning');
    setTimeout(() => { hang(n); render(loop.time); document.body.classList.remove('is-turning'); turning = false; }, 470);
  }
  addEventListener('keydown', e => {
    if (room.open || e.altKey || e.metaKey || e.ctrlKey) return;
    if (e.key === 'ArrowLeft') turn(no - 1); else if (e.key === 'ArrowRight') turn(no + 1);
  });
  let sx = null, sy = null;
  addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' && !room.open && !e.target.closest('a,button')) { sx = e.clientX; sy = e.clientY; } });
  addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(no + (dx < 0 ? -1 : 1));
  });
})();
</script>
</body>
</html>
