<script>
(function () {
  'use strict';
  const T = Tangerine, canvas = document.getElementById('grove');
  const ctx = canvas.getContext('2d');
  const visit = T.visit('the-grove', 7);
  const params = new URLSearchParams(location.search);
  const PAPER = '#f1e6d0';

  /* Three inks, printed one over another. Where they overlap they make the
     colours nobody mixed: orange on pink is vermilion, green on orange is olive. */
  const INK = { green: '#2c6443', orange: '#f0732a', pink: '#f2a0ae' };

  /* ----- Time of day only changes the sun ----- */
  const hour = params.has('hour') ? parseFloat(params.get('hour')) : T.dayPhase() * 24;
  const sunInk = hour < 6 || hour >= 20 ? { ink: 'green', a: 0.16 }       // a pale green moon
              : hour < 10 ? { ink: 'pink', a: 0.42 }                       // early, pale
              : hour < 16 ? { ink: 'orange', a: 0.34 }                     // high and warm
              : { ink: 'pink', a: 0.85 };                                  // late, deep

  /* ----- Paper and ink texture, made once ----- */
  function noiseTile(size, fn) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
    for (let i = 0; i < size * size; i++) { const v = fn(i % size, (i / size) | 0); d[i * 4] = v[0]; d[i * 4 + 1] = v[1]; d[i * 4 + 2] = v[2]; d[i * 4 + 3] = v[3]; }
    g.putImageData(img, 0, 0);
    return c;
  }
  const R0 = T.rng(91);
  // smooth-ish value noise on a small lattice, for blotches in the ink
  const lat = 64, grid = Array.from({ length: lat * lat }, () => R0());
  const vn = (x, y, s) => {
    x = x / s; y = y / s; const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const g = (a, b) => grid[((a % lat + lat) % lat) + ((b % lat + lat) % lat) * lat];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return (g(xi, yi) * (1 - u) + g(xi + 1, yi) * u) * (1 - v) + (g(xi, yi + 1) * (1 - u) + g(xi + 1, yi + 1) * u) * v;
  };
  // Ink: mostly solid, thinning in soft blotches, with the occasional speck of bare paper.
  const inkTile = noiseTile(512, (x, y) => {
    const blot = vn(x, y, 8) * 0.6 + vn(x, y, 2) * 0.4;
    const speck = R0() < 0.035 * (blot < 0.35 ? 3 : 1) ? 0.35 : 1;
    const a = Math.min(1, (0.8 + blot * 0.28) * speck * (0.94 + R0() * 0.06));
    return [0, 0, 0, a * 255];
  });
  // Paper: fibres and tooth, multiplied over everything.
  const paperTile = noiseTile(512, (x, y) => {
    const fib = vn(x * 0.25, y * 3, 3) * 0.5 + vn(x, y, 16) * 0.5;
    const v = 255 - (R0() * 14 + fib * 12);
    return [v, v - 2, v - 6, 255];
  });
  let inkPattern = null;
  const paper = document.getElementById('paper');
  paper.style.backgroundImage = 'url(' + paperTile.toDataURL() + ')';

  /* ----- Growing the grove (once per visit and per size) ----- */
  let W = 0, H = 0, dpr = 1, S = 0, scene = null;
  const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
  const shade = document.createElement('canvas'), sctx = shade.getContext('2d');

  function bez(p0, p1, p2, p3, t) {
    const u = 1 - t;
    return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
            u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
  }

  function grow() {
    const rnd = T.rng(visit.seed);
    const portrait = H > W * 1.05;
    S = Math.min(W, H) * (portrait ? 1.05 : 0.92);
    const X = f => f * W, Y = f => f * H;
    const branches = [];
    // A main bough from the upper left, a second reaching in from the right.
    // Four ways a grove can enter the frame. Each visit takes one, sometimes mirrored.
    const L = {
      bough:    { b: [[[-0.05, 0.1], [0.3, -0.06], [0.6, 0.18], [0.74, 0.58]], [[1.05, 0.06], [0.96, 0.14], [0.9, 0.28], [0.86, 0.44]]], sun: [0.66, 0.34, 0.42] },
      rising:   { b: [[[1.06, 0.78], [0.8, 0.74], [0.6, 0.5], [0.42, 0.12]], [[0.74, 0.62], [0.82, 0.44], [0.9, 0.3], [0.97, 0.12]]], sun: [0.3, 0.3, 0.36] },
      canopy:   { b: [[[0.4, -0.08], [0.36, 0.16], [0.44, 0.36], [0.6, 0.5]], [[1.0, -0.08], [0.9, 0.1], [0.82, 0.24], [0.72, 0.34]]], sun: [0.56, 0.44, 0.36] },
      crossing: { b: [[[-0.06, 0.52], [0.26, 0.36], [0.5, 0.2], [0.82, 0.16]], [[1.06, 0.2], [0.82, 0.32], [0.66, 0.52], [0.56, 0.62]]], sun: [0.74, 0.5, 0.34] }
    };
    const P_ = {
      bough:    { b: [[[-0.08, 0.08], [0.36, -0.03], [0.7, 0.14], [0.84, 0.46]], [[1.08, 0.5], [0.94, 0.5], [0.84, 0.56], [0.74, 0.64]]], sun: [0.64, 0.32, 0.36] },
      rising:   { b: [[[1.08, 0.66], [0.78, 0.6], [0.5, 0.42], [0.3, 0.1]], [[0.7, 0.52], [0.8, 0.38], [0.88, 0.24], [0.96, 0.08]]], sun: [0.34, 0.26, 0.36] },
      canopy:   { b: [[[0.3, -0.06], [0.24, 0.16], [0.36, 0.34], [0.56, 0.44]], [[1.04, 0.02], [0.92, 0.14], [0.84, 0.24], [0.72, 0.3]]], sun: [0.56, 0.4, 0.38] },
      crossing: { b: [[[-0.08, 0.4], [0.3, 0.3], [0.54, 0.16], [0.86, 0.1]], [[1.08, 0.18], [0.8, 0.3], [0.6, 0.48], [0.5, 0.62]]], sun: [0.7, 0.42, 0.36] }
    };
    const names = ['bough', 'rising', 'canopy', 'crossing', 'bough', 'canopy', 'crossing'];
    const plan = (portrait ? P_ : L)[names[visit.index % names.length]];
    // Tall screens: let the grove come further down toward the name.
    const tall = portrait ? Math.min(1.3, 1 + (H / W - 1.05) * 0.35) : 1;
    const flip = names[visit.index] !== 'rising' && rnd() < 0.5;
    const fx = x => (flip ? 1 - x : x);
    const plans = plan.b.map(br => br.map(([x, y]) => [fx(x), y * tall]));
    const jig = () => (rnd() - 0.5) * 0.05;
    plans.forEach((pl, bi) => {
      const pts = pl.map(([x, y], k) => [X(x + (k ? jig() : 0)), Y(y + (k ? jig() : 0))]);
      const b = { pts, root: pts[0], width: S * (bi ? 0.02 : 0.03), leaves: [], fruit: [], blossoms: [], flex: bi ? 1.3 : 1, phase: rnd() * 6 };
      const nodes = bi ? 5 : 8;
      for (let i = 0; i < nodes; i++) {
        const t = 0.18 + (i / nodes) * 0.8 + (rnd() - 0.5) * 0.03;
        const p = bez(...pts, t), q = bez(...pts, Math.min(1, t + 0.01));
        const ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
        const side = i % 2 ? 1 : -1;
        const len = S * (0.2 + rnd() * 0.12) * (1 - t * 0.3);
        b.leaves.push({ t, side, base: ang + side * (0.55 + rnd() * 0.6), len, wide: 0.36 + rnd() * 0.14,
          tone: rnd() < 0.7 ? 1 : 0.6, ink: rnd() < 0.08 ? 'pink' : 'green', rib: rnd() < 0.7,
          a: 0, v: 0, flut: 1.2 + rnd() * 1.6, ph: rnd() * 6.28, seed: rnd() * 1000 });
        if (i > 1 && i < nodes - 1 && rnd() < (bi ? 0.4 : 0.45)) {
          b.fruit.push({ t: t + 0.01, r: S * (0.065 + rnd() * 0.04), stem: S * (0.02 + rnd() * 0.04), a: 0, v: 0, seed: rnd() * 1000 });
        }
      }
      // blossom at the tip of the branch, sometimes two
      const nb = 1 + Math.floor(rnd() * 3);
      for (let k = 0; k < nb; k++) b.blossoms.push({ t: 0.93 + rnd() * 0.07, off: [(rnd() - 0.5) * S * 0.09, (rnd() - 0.4) * S * 0.07], r: S * (0.022 + rnd() * 0.012), spin: rnd() * 6 });
      if (!b.fruit.length) b.fruit.push({ t: 0.6, r: S * 0.07, stem: S * 0.03, a: 0, v: 0, seed: rnd() * 1000 });
      branches.push(b);
    });
    // The sun, or the moon: a large disc, half behind the leaves.
    const sun = { x: X(fx(plan.sun[0])), y: Y(plan.sun[1] * tall), r: S * plan.sun[2] };
    scene = { branches, sun };

    const mx = Math.round(Math.max(22, Math.min(W * 0.05, 76)));
    const wm = Math.round(portrait ? Math.min(W * 0.66, 440) : Math.max(260, Math.min(W * 0.3, 520)));
    document.documentElement.style.setProperty('--mx', mx + 'px');
    document.documentElement.style.setProperty('--wm', wm + 'px');
  }

  /* ----- Shapes, each a little hand-cut ----- */
  function leafPath(g, len, wide, seed) {
    const n = 22, r = T.rng(seed | 0), jit = () => (r() - 0.5) * S * 0.0022;
    g.moveTo(0, 0);
    for (let i = 1; i <= n; i++) { const x = i / n; g.lineTo(x * len + jit(), -Math.pow(Math.sin(Math.PI * Math.pow(x, 0.85)), 0.9) * len * wide * 0.5 * (1 - x * 0.12) + jit()); }
    for (let i = n - 1; i >= 1; i--) { const x = i / n; g.lineTo(x * len + jit(), Math.pow(Math.sin(Math.PI * Math.pow(x, 0.8)), 0.95) * len * wide * 0.46 + jit()); }
    g.closePath();
  }
  function discPath(g, x, y, r, seed) {
    const n = 48, rr = T.rng(seed | 0), wob = rr() * 6;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2, k = r * (1 + 0.018 * Math.sin(a * 3 + wob) + (rr() - 0.5) * 0.008);
      i ? g.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k) : g.moveTo(x + Math.cos(a) * k, y + Math.sin(a) * k);
    }
    g.closePath();
  }

  /* ----- The breeze ----- */
  function wind(t) {
    return 0.55 * Math.sin(t * 0.23) + 0.3 * Math.sin(t * 0.61 + 1.3) + 0.15 * Math.sin(t * 1.37 + 0.4)
         + 0.5 * Math.max(0, Math.sin(t * 0.071 + visit.seed)) ** 6;                  // a gust, now and then
  }
  // Damped spring toward a target angle; returns new [a, v].
  const spring = (o, target, dt, k = 9, c = 3.2) => { const acc = k * (target - o.a) - c * o.v; o.v += acc * dt; o.a += o.v * dt; };

  // Where a point on a branch is, after the branch has bent in the wind.
  function bend(b, p, sway) {
    const dx = p[0] - b.root[0], dy = p[1] - b.root[1], d = Math.hypot(dx, dy);
    const ang = sway * b.flex * 0.012 * (d / S);
    const c = Math.cos(ang), s = Math.sin(ang);
    return [b.root[0] + dx * c - dy * s, b.root[1] + dx * s + dy * c];
  }

  /* ----- One frame ----- */
  let lastT = 0;
  function frame(t, dt) {
    if (!scene) return;
    const P = T.pointer, still = T.reduced();
    const w = still ? 0 : wind(t);
    const px = P.x * W, py = P.y * H, pvx = still ? 0 : P.vx * W, pvy = still ? 0 : P.vy * H;
    const touchR = S * 0.22;
    const near = (x, y) => { const d = Math.hypot(x - px, y - py); return P.inside ? Math.exp(-(d * d) / (touchR * touchR)) : 0; };

    // Per-ink drawing lists: [ink, alpha, fn(g)]
    const draws = { green: [], orange: [], pink: [] };
    const shadowFns = [];

    // the sun first, behind everything
    draws[sunInk.ink].push([sunInk.a, g => { g.beginPath(); discPath(g, scene.sun.x + Math.sin(t / 300) * S * 0.01, scene.sun.y, scene.sun.r, 7); g.fill(); }]);

    scene.branches.forEach((b, bi) => {
      const sway = w + Math.sin(t * 0.4 + b.phase) * 0.15;
      const pts = b.pts.map(p => bend(b, p, sway));
      // the bough: a tapered ribbon along the curve
      const fnBough = g => {
        const N = 40, L = [], Rr = [];
        for (let i = 0; i <= N; i++) {
          const tt = i / N, p = bez(...pts, tt), q = bez(...pts, Math.min(1, tt + 0.01)), a = Math.atan2(q[1] - p[1], q[0] - p[0]);
          const wd = b.width * (1 - tt * 0.78);
          L.push([p[0] + Math.cos(a + 1.57) * wd / 2, p[1] + Math.sin(a + 1.57) * wd / 2]);
          Rr.push([p[0] - Math.cos(a + 1.57) * wd / 2, p[1] - Math.sin(a + 1.57) * wd / 2]);
        }
        g.beginPath(); g.moveTo(...L[0]); L.forEach(p => g.lineTo(...p)); Rr.reverse().forEach(p => g.lineTo(...p)); g.closePath(); g.fill();
      };
      draws.green.push([1, fnBough]); shadowFns.push(fnBough);

      b.leaves.forEach(l => {
        const p = bez(...pts, l.t);
        const gust = near(p[0], p[1]);
        const stir = Math.max(-0.2, Math.min(0.2, (pvx * 0.0002 - pvy * 0.00011 * l.side) * gust));
        const target = w * 0.05 * b.flex + Math.sin(t * l.flut + l.ph) * 0.025 * (0.4 + Math.abs(w)) + stir;
        if (!still) spring(l, target, dt, 7, 2.6); else { l.a = 0; l.v = 0; }
        const fn = g => {
          g.save(); g.translate(p[0], p[1]); g.rotate(l.base + l.a); g.beginPath(); leafPath(g, l.len, l.wide, l.seed); g.fill();
          if (l.rib) { g.globalCompositeOperation = 'destination-out'; g.lineWidth = Math.max(1, S * 0.0022); g.beginPath(); g.moveTo(l.len * 0.08, 0); g.quadraticCurveTo(l.len * 0.5, l.len * 0.02, l.len * 0.86, 0); g.stroke(); }
          g.restore();
        };
        draws[l.ink].push([l.tone, fn]); shadowFns.push(fn);
      });

      b.fruit.forEach(f => {
        const p = bez(...pts, f.t);
        const gust = near(p[0], p[1] + f.stem + f.r);
        if (!still) spring(f, -w * 0.07 - pvx * 0.00012 * gust, dt, 4.2, 1.4); else { f.a = 0; f.v = 0; }
        const cx = p[0] + Math.sin(f.a) * (f.stem + f.r), cy = p[1] + Math.cos(f.a) * (f.stem + f.r);
        const fnStem = g => { g.lineWidth = Math.max(1.2, S * 0.0035); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(cx - Math.sin(f.a) * f.r * 0.9, cy - Math.cos(f.a) * f.r * 0.9); g.stroke();
          // the calyx: a small cut star where stem meets fruit
          g.save(); g.translate(cx - Math.sin(f.a) * f.r * 0.88, cy - Math.cos(f.a) * f.r * 0.88); g.rotate(-f.a); g.beginPath();
          for (let k = 0; k < 10; k++) { const a = (k / 10) * Math.PI * 2, rr = (k % 2 ? 0.08 : 0.2) * f.r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 0.6); }
          g.closePath(); g.fill(); g.restore(); };
        const fnFruit = g => { g.beginPath(); discPath(g, cx, cy, f.r, f.seed); g.fill(); };
        draws.orange.push([1, fnFruit]); draws.green.push([1, fnStem]); shadowFns.push(fnFruit);
      });

      b.blossoms.forEach(bl => {
        const p = bez(...pts, bl.t), cx = p[0] + bl.off[0], cy = p[1] + bl.off[1];
        const spin = bl.spin + (still ? 0 : Math.sin(t * 0.5 + bl.spin) * 0.06);
        const fnPet = g => { for (let k = 0; k < 5; k++) { const a = spin + (k / 5) * Math.PI * 2; g.beginPath(); g.ellipse(cx + Math.cos(a) * bl.r * 0.9, cy + Math.sin(a) * bl.r * 0.9, bl.r * 0.82, bl.r * 0.5, a, 0, Math.PI * 2); g.fill(); } };
        const fnHeart = g => { g.beginPath(); g.arc(cx, cy, bl.r * 0.32, 0, Math.PI * 2); g.fill(); };
        draws.pink.push([0.9, fnPet]); draws.orange.push([1, fnHeart]); shadowFns.push(fnPet);
      });
    });

    /* print: paper, shadows of the lifted paper, then each ink */
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // shadows: drawn small and stretched up, which blurs them for free
    sctx.setTransform(shade.width / W, 0, 0, shade.height / H, 0, 0);
    sctx.clearRect(0, 0, W, H);
    sctx.fillStyle = 'rgba(70,45,20,1)'; sctx.strokeStyle = sctx.fillStyle;
    shadowFns.forEach(fn => fn(sctx));
    ctx.globalAlpha = 0.11;
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(shade, S * 0.006 * dpr, S * 0.01 * dpr, canvas.width, canvas.height);
    ctx.globalAlpha = 1;

    const reg = { green: [0, 0], orange: [0.8, -0.6], pink: [-0.7, 0.9] };   // a little misregistration
    ['pink', 'orange', 'green'].forEach((ink, k) => {
      lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lctx.globalCompositeOperation = 'source-over';
      lctx.clearRect(0, 0, W, H);
      lctx.fillStyle = INK[ink]; lctx.strokeStyle = INK[ink];
      draws[ink].forEach(([a, fn]) => { lctx.globalAlpha = a; fn(lctx); });
      lctx.globalAlpha = 1;
      lctx.globalCompositeOperation = 'destination-in';
      lctx.setTransform(1, 0, 0, 1, 0, 0);
      lctx.fillStyle = inkPattern;
      const off = 97 * k;
      lctx.translate(off, off * 0.6); lctx.fillRect(-off, -off, layer.width + off, layer.height + off);
      ctx.globalCompositeOperation = 'multiply';
      ctx.drawImage(layer, reg[ink][0] * dpr, reg[ink][1] * dpr);
    });

    ctx.globalCompositeOperation = 'source-over';
  }

  T.onResize((w, h, d) => {
    W = w; H = h; dpr = Math.min(d, W * H > 1.4e6 ? 1.5 : 2);
    canvas.width = layer.width = Math.round(W * dpr); canvas.height = layer.height = Math.round(H * dpr);
    shade.width = Math.max(64, Math.round(W / 10)); shade.height = Math.max(64, Math.round(H / 10));
    inkPattern = lctx.createPattern(inkTile, 'repeat');
    grow();
    frame(loop ? loop.time : 0, 1 / 60);
  });

  var loop = T.loop((t, dt) => { T.pointer.step(dt, 0.25); frame(t, Math.min(dt, 1 / 30)); }, { offset: 0, maxFps: 60 });
  function setMotion() { if (T.reduced()) { loop.stop(); frame(loop.time, 0); } else loop.start(); }
  T.onMotionChange(setMotion);
  setMotion();
  document.body.classList.add('is-ready');

  T.room({ trigger: document.getElementById('enter'), onEnter() { loop.fps(24); }, onLeave() { loop.fps(60); } });
})();
</script>
</body>
</html>
