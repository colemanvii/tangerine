<script>
/* THE RULES
   1. One wall, one window, one light.
   2. The light is the sun where you are, now: your clock, today's date, your hemisphere.
   3. The lower the sun, the longer its path through the air, the warmer its colour.
   4. Low light climbs the wall and leans; high light falls and straightens. It travels
      across the wall as the day goes, at the speed of the day.
   5. The sky fills the shadows: blue at noon, rose at sunset, ink at night.
   6. Each day the wall is painted one pigment. The same light falls differently on each.
   7. Grazing light shows the plaster; high light flattens it.
   8. At night the moon takes over, as bright as tonight's real moon. When there is no
      moon, the streetlight.
   9. Our name is lettered on the glass. It appears only where the light does.
   Everything else that moves is what moves in a room: dust in the beam, a passing cloud. */
(function () {
  'use strict';
  const T = Tangerine, canvas = document.getElementById('light'), label = document.getElementById('label');
  const params = new URLSearchParams(location.search);
  const rad = Math.PI / 180, clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const L = T.hexToLin;

  /* ----- Where and when ----- */
  const zone = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } })();
  const south = /^(Australia|Antarctica|Pacific\/(Auckland|Chatham|Fiji|Tongatapu|Apia|Noumea|Efate)|America\/(Sao_Paulo|Argentina|Buenos_Aires|Santiago|Montevideo|Asuncion|Punta_Arenas|Lima|La_Paz|Campo_Grande|Cuiaba)|Africa\/(Johannesburg|Maputo|Harare|Windhoek|Gaborone|Maseru|Mbabane|Lusaka|Luanda|Lubumbashi|Blantyre)|Indian\/(Mauritius|Reunion|Antananarivo))/.test(zone);
  const equator = /^(Asia\/(Singapore|Jakarta|Kuala_Lumpur|Pontianak|Makassar)|Africa\/(Nairobi|Lagos|Accra|Kampala|Kinshasa|Libreville|Douala)|America\/(Bogota|Guayaquil|Manaus|Belem|Caracas|Panama)|Pacific\/Galapagos)/.test(zone);
  const LAT = equator ? 3 : south ? -34 : 40;
  // longitude from the standard (non-summer) offset of the visitor's zone
  const yr = new Date().getFullYear();
  const stdOffset = Math.max(new Date(yr, 0, 1).getTimezoneOffset(), new Date(yr, 6, 1).getTimezoneOffset());
  const LON = -stdOffset / 4;

  function clockNow() {
    const d = new Date();
    if (params.has('date')) { const [y, m, dd] = params.get('date').split('-').map(Number); if (y && m && dd) d.setFullYear(y, m - 1, dd); }
    if (params.has('hour')) { const h = parseFloat(params.get('hour')); if (isFinite(h)) d.setHours(Math.floor(h), Math.round((h % 1) * 60), 0, 0); }
    return d;
  }

  // The sun (or the moon) in the visitor's sky: altitude, azimuth, hour angle (radians).
  function sky(date, hourShift = 0, decShift = null) {
    const N = (date - Date.UTC(date.getUTCFullYear(), 0, 0)) / 864e5;
    const dec = decShift !== null ? decShift : 23.44 * rad * Math.sin(2 * Math.PI * (284 + N) / 365);
    const B = 2 * Math.PI * (N - 81) / 364;
    const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    const utc = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
    let H = ((utc + LON / 15 + eot / 60 - 12) * 15 * rad) - hourShift;
    H = Math.atan2(Math.sin(H), Math.cos(H));
    const phi = LAT * rad;
    const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
    const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
    return { alt, az, H, dec };
  }
  function moonPhase(date) {
    const p = ((date - Date.UTC(2000, 0, 6, 18, 14)) / 864e5 / 29.530588853) % 1;
    return p < 0 ? p + 1 : p;
  }

  // Rule 3: sunlight through air. Colour from air mass, normalised; brightness falls a little.
  function sunColour(alt) {
    const a = Math.max(alt, 0.002) / rad;
    const m = 1 / (Math.sin(a * rad) + 0.50572 * Math.pow(a + 6.07995, -1.6364));
    const tr = [0.055, 0.12, 0.27].map(t => Math.exp(-t * m));
    const mx = Math.max(...tr);
    return { c: [1.0, 0.96, 0.9].map((b, i) => b * tr[i] / mx), k: 0.45 + 0.55 * (tr[0] + tr[1] + tr[2]) / 3 };
  }
  // Rule 5: the colour of the sky that fills the shadows, by the sun's altitude in degrees.
  const skyKeys = [
    [-90, '#0d1322', 0.16], [-14, '#111a30', 0.18], [-8, '#22305a', 0.24], [-4, '#5a4f7c', 0.32],
    [0, '#9a7a92', 0.42], [4, '#d0a690', 0.5], [12, '#d6c8bb', 0.58], [35, '#cfd0d2', 0.64], [90, '#d3d6dc', 0.68]
  ].map(([d, hex, k]) => [d, L(hex), k]);
  function skyFill(altDeg) {
    let i = 0; while (i < skyKeys.length - 2 && skyKeys[i + 1][0] <= altDeg) i++;
    const [d0, c0, k0] = skyKeys[i], [d1, c1, k1] = skyKeys[i + 1];
    const t = smooth(0, 1, (altDeg - d0) / (d1 - d0));
    return c0.map((v, j) => (v + (c1[j] - v) * t) * (k0 + (k1 - k0) * t));
  }

  /* ----- Rule 6: the pigment of the day ----- */
  const PIGMENTS = [
    ['Lime white', '#ebe6db'], ['Naples yellow', '#e8d4a2'], ['Rose madder', '#e7c1ba'], ['Terre verte', '#bac4ab'],
    ['Ultramarine ash', '#bac2d0'], ['Yellow ochre', '#dbb784'], ['Venetian red', '#d69d8a'], ['Bone', '#e2d9ca'],
    ['Tangerine', '#ec9a64'], ['Lamp black', '#57544e']
  ];
  const edition = params.has('no') ? Math.max(1, parseInt(params.get('no'), 10) || 1) : T.edition(clockNow());
  // walk through the box so no two days in a row share a wall
  let pig = 0; for (let d = 2; d <= edition; d++) pig = (pig + 1 + Math.floor(T.hash(d * 31 + 7) * (PIGMENTS.length - 1))) % PIGMENTS.length;
  if (params.has('pigment')) pig = clamp(parseInt(params.get('pigment'), 10) - 1 || 0, 0, PIGMENTS.length - 1);
  const pigment = { name: PIGMENTS[pig][0], lin: L(PIGMENTS[pig][1]) };
  const today = {
    cloud: [0, 0, 0.35, 0.6][Math.floor(T.hash(edition * 13 + 1) * 4)],   // some days are clear
    transom: 3 + Math.floor(T.hash(edition * 17 + 5) * 3),
    glass: T.hash(edition * 19 + 3) * 100
  };

  /* ----- Lettering on the glass, as a texture ----- */
  function letteringTexture(gl) {
    const c = document.createElement('canvas'); c.width = 2048; c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, 2048, 512);
    const path = new Path2D(document.querySelector('#wm path').getAttribute('d'));
    const s = 1840 / 1393;
    g.translate((2048 - 1393 * s) / 2, (512 - 295 * s) / 2);
    g.scale(s, s);
    g.fillStyle = '#fff'; g.fill(path, 'evenodd');
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, gl.LUMINANCE, gl.UNSIGNED_BYTE, c);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
  }

  const gl = T.gl(canvas);

  const WALL = T.glslNoise + `
uniform vec2 uRes; uniform float uTime, uSeed;
uniform vec4 uInv[3]; uniform vec2 uO[3]; uniform vec2 uLen[3]; uniform vec3 uSrc[3]; uniform float uSoft[3];
uniform vec3 uAmb, uBounce, uPigment;
uniform float uCloud, uRelief, uTransom, uGlass;
uniform sampler2D uWord;
varying vec2 vUv;

// signed distance (wall units, + inside) to the panes: a row of small lights over one plate
float panes(vec2 uv,vec2 len){
  float d=min(min(uv.x,1.-uv.x)*len.x,min(uv.y,1.-uv.y)*len.y);
  float vt=.24;
  d=min(d,abs(uv.y-vt)*len.y-.013);
  if(uv.y<vt){ float m=abs(fract(uv.x*uTransom+.5)-.5)/uTransom*len.x-.0062; d=min(d,m); }
  return d;
}

void main(){
  float asp=uRes.x/uRes.y;
  vec2 p=vec2(vUv.x*asp,vUv.y);
  float t=uTime;

  // limewash: the pigment brushed on in broad, uneven passes
  float wash=fbm(p*2.2+uSeed);
  float sweep=fbm3(vec2(p.x*1.1+fbm3(p*1.4+uSeed)*1.6,p.y*6.5)+uSeed*2.);
  vec3 albedo=uPigment*(.93+.1*wash+.06*(sweep-.5))*(.985+.03*fbm3(p*22.-uSeed));

  vec3 light=uAmb*(.84+.24*vUv.y)+uBounce;
  float beam=0.;
  float bump=fbm3(p*38.+3.)-.5;

  for(int i=0;i<3;i++){
    vec3 src=uSrc[i];
    if(src.r+src.g+src.b<.002) continue;
    vec2 q=p-uO[i];
    vec2 uv=vec2(dot(uInv[i].xy,q),dot(uInv[i].zw,q));
    float cl=(i==0)?uCloud:0.;
    float soft=uSoft[i]*(.65+.7*clamp(uv.y,0.,1.))*(1.+cl*2.5);
    float d=panes(uv,uLen[i]);
    float lit=smoothstep(-soft,soft,d);
    // old glass is never flat
    lit*=1.+(fbm3(vec2(uv.x*3.,uv.y*11.)+uGlass)-.5)*.12;
    lit*=1.06-.14*clamp(uv.y,0.,1.);
    // the lettering on the plate
    float wordW=.8, wordH=wordW*.25*uLen[i].x/uLen[i].y;
    vec2 wv=vec2((uv.x-(1.-wordW)*.5)/wordW,(uv.y-.52)/wordH+.5);
    float letters=0.;
    if(wv.x>0.&&wv.x<1.&&wv.y>0.&&wv.y<1.) letters=texture2D(uWord,wv,log2(1.+soft*900.)-.6).r;
    lit*=1.-letters*.9;
    lit*=1.-cl*.6;
    float glow=smoothstep(-soft*14.-.05,soft*10.+.07,d);
    // grazing light finds the plaster
    float relief=1.+bump*uRelief;
    light+=src*(lit*relief+glow*.08);
    beam=max(beam,lit*dot(src,vec3(.33)));
  }

  vec3 col=albedo*light;
  col=1.-exp(-col*1.55);
  gl_FragColor=vec4(toSrgb(col),clamp(beam,0.,1.));
}`;

  const LENS = T.glslNoise + T.glslGrain + `
uniform sampler2D uTex; uniform vec2 uRes; uniform float uTime, uDpr, uSeed, uMotes;
uniform vec4 uAir;
varying vec2 vUv;
float motes(vec2 px,float cell,float speed,float seed){
  vec2 dpx=uAir.xy-px; float near=exp(-dot(dpx,dpx)/(160.*160.*uDpr*uDpr));
  px-=uAir.zw*near*.35;
  vec2 drift=vec2(sin(uTime*.05+seed)*30.,uTime*speed);
  vec2 g=(px+drift)/cell; vec2 id=floor(g); vec2 f=fract(g);
  float h=h21(id+seed);
  if(h>.2) return 0.;
  float h2=h21(id+seed+7.1), h3=h21(id+seed+3.3);
  vec2 c=vec2(.3+.4*h2,.3+.4*h3)+.12*vec2(sin(uTime*(.2+h2*.3)+h*30.),cos(uTime*(.17+h3*.3)+h*20.));
  float r=(.5+h2*1.1)*uDpr/cell;
  float glint=.35+.65*pow(.5+.5*sin(uTime*(.6+h3*1.4)+h*50.),4.);
  return smoothstep(r,r*.15,length(f-c))*glint;
}
void main(){
  vec2 px=gl_FragCoord.xy;
  vec4 s=texture2D(uTex,vUv);
  vec3 c=s.rgb;
  float beam=smoothstep(.1,.9,s.a);
  float m=motes(px,46.*uDpr,9.*uDpr,uSeed)*.9+motes(px,83.*uDpr,14.*uDpr,uSeed+11.)*.6;
  c+=vec3(1.,.95,.86)*m*beam*.3*uMotes;
  c=applyGrain(c,px,uSeed,.06);
  gl_FragColor=vec4(c,1.);
}`;

  let W = 0, H = 0, dpr = 1, lowW = 0, lowH = 0, target = null, loop = null;
  let wall = null, lens = null, word = null;
  if (gl) { wall = T.program(gl, WALL); lens = T.program(gl, LENS); word = letteringTexture(gl); }

  /* ----- Rule 4: from a position in the sky to a parallelogram on the wall -----
     The window's sides stay vertical; its top and bottom lean with the light. */
  function footprint(src) {
    const asp = W / H, portrait = asp < 0.9;
    const alt = clamp(src.alt, -0.4, 1.25);
    // morning light leans one way, evening the other; at noon it comes straight in
    const side = -clamp(Math.sin(src.H) * 2.5, -1, 1);
    const k = side * Math.sign(alt || 1) * clamp(Math.tan(Math.abs(alt)) * 0.7, 0.02, 0.32);
    const w = (portrait ? asp * 0.96 : Math.min(asp * 0.62, 1.12)) * (0.92 + 0.22 * Math.abs(Math.sin(src.az || 0)));
    const h = portrait ? 0.6 : 0.84;
    const cy = (portrait ? 0.64 : 0.66) - (portrait ? 0.16 : 0.26) * clamp(alt / 1.1, -0.5, 1);
    const half = 0.4 * w + 0.03 * asp, lo = half, hi = asp - half;
    const day = 0.5 + 0.5 * Math.sin(clamp(src.H, -1.7, 1.7));         // travels across the wall with the day
    const cx = hi > lo ? lo + (hi - lo) * day : asp / 2;
    const U = [w, k * w], V = [0, -h];
    const O = [cx - U[0] / 2 - V[0] / 2, cy - U[1] / 2 - V[1] / 2];
    const det = U[0] * V[1] - U[1] * V[0];
    return { O, inv: [V[1] / det, -V[0] / det, -U[1] / det, U[0] / det], len: [Math.hypot(U[0], U[1]), Math.abs(V[1])] };
  }

  /* ----- The state of the light at a moment ----- */
  function lightAt(date, t) {
    const sun = sky(date);
    const p = moonPhase(date);
    const moon = sky(date, p * 2 * Math.PI, sun.dec * Math.cos(2 * Math.PI * p));
    const illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
    const sc = sunColour(sun.alt);
    // clouds: some days clear, some with slow passing cloud
    const n = Math.sin(t * 0.021 + edition) * 0.5 + Math.sin(t * 0.0131 + 2.1) * 0.35 + Math.sin(t * 0.0057) * 0.15;
    const cloud = today.cloud * smooth(0.1, 0.6, n);
    const sunI = 2.0 * smooth(-0.012, 0.07, sun.alt) * sc.k;
    const dark = 1 - smooth(-0.15, -0.055, sun.alt);                   // night begins after the blue hour
    const moonI = (0.06 + 0.4 * illum) * smooth(0, 0.12, moon.alt) * dark;
    const streetI = 0.34 * dark * (1 - smooth(0.02, 0.07, moonI));
    return {
      sun, moon, cloud, illum,
      sources: [
        { ...sun, col: sc.c.map(v => v * sunI), soft: 0.0032 },
        { ...moon, col: L('#b8c8ee').map(v => v * moonI * 0.85), soft: 0.0036 },
        { alt: -0.3, H: 0.55, az: 0.4, col: L('#ff9a4a').map(v => v * streetI), soft: 0.011 }
      ],
      amb: skyFill(sun.alt / rad),
      bounce: sc.c.map(v => v * sunI * 0.1),
      relief: 0.05 + 0.11 * (1 - smooth(0.05, 0.9, Math.max(sun.alt, moonI > 0.02 ? moon.alt : 0)))
    };
  }

  /* ----- Time, and moving through it ----- */
  let shift = 0, scrubbing = false, idle = 0;
  const fmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  let lastLabel = '';
  function showLabel(date, st) {
    const time = fmt.format(date).replace(/\s?([AP])M$/i, (m, a) => ' ' + a.toLowerCase() + 'm');
    const html = 'No. ' + T.pad3(edition) + ' · ' + pigment.name + ' · ' + (shift ? '<i>' + time + '</i>' : time);
    if (html !== lastLabel) { label.innerHTML = html; lastLabel = html; }
    // text and browser chrome follow the wall in shadow
    const lum = st.amb.map((v, i) => 1 - Math.exp(-1.55 * pigment.lin[i] * (v * 0.9 + st.bounce[i])));
    const y = 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2];
    const darkWall = y < 0.22 || pigment.name === 'Lamp black';
    document.body.classList.toggle('is-dark', darkWall);
    const hex = '#' + lum.map(v => Math.round(255 * Math.pow(v, 1 / 2.2)).toString(16).padStart(2, '0')).join('');
    document.documentElement.style.setProperty('--text', darkWall ? '#ece4d6' : '#2b231d');
    document.documentElement.style.setProperty('--wall', hex);
    const meta = document.querySelector('meta[name=theme-color]'); if (meta.content !== hex) meta.content = hex;
  }

  const air = [0, 0, 0, 0];
  function render(t) {
    const date = new Date(clockNow().getTime() + shift * 3600e3);
    const st = lightAt(date, t);
    showLabel(date, st);
    if (!gl) return;
    const inv = [], O = [], len = [], col = [], soft = [];
    st.sources.forEach(s => {
      const f = footprint(s);
      inv.push(...f.inv); O.push(...f.O); len.push(...f.len); col.push(...s.col); soft.push(s.soft);
    });
    gl.useProgram(wall);
    gl.uniform2f(wall.u('uRes'), lowW, lowH);
    gl.uniform1f(wall.u('uTime'), t);
    gl.uniform1f(wall.u('uSeed'), (edition * 7.31) % 50);
    gl.uniform4fv(wall.u('uInv'), inv);
    gl.uniform2fv(wall.u('uO'), O);
    gl.uniform2fv(wall.u('uLen'), len);
    gl.uniform3fv(wall.u('uSrc'), col);
    gl.uniform1fv(wall.u('uSoft'), soft);
    gl.uniform3fv(wall.u('uAmb'), st.amb);
    gl.uniform3fv(wall.u('uBounce'), st.bounce);
    gl.uniform3fv(wall.u('uPigment'), pigment.lin);
    gl.uniform1f(wall.u('uCloud'), T.reduced() ? 0 : st.cloud);
    gl.uniform1f(wall.u('uRelief'), st.relief);
    gl.uniform1f(wall.u('uTransom'), today.transom);
    gl.uniform1f(wall.u('uGlass'), today.glass);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, word);
    gl.uniform1i(wall.u('uWord'), 1);
    T.draw(gl, wall, target, lowW, lowH);

    gl.useProgram(lens);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, target.tex);
    gl.uniform1i(lens.u('uTex'), 0);
    gl.uniform2f(lens.u('uRes'), canvas.width, canvas.height);
    gl.uniform1f(lens.u('uTime'), t);
    gl.uniform1f(lens.u('uDpr'), dpr);
    gl.uniform1f(lens.u('uSeed'), (edition % 89) + 0.5);
    gl.uniform1f(lens.u('uMotes'), T.reduced() ? 0 : 1);
    gl.uniform4fv(lens.u('uAir'), air);
    T.draw(gl, lens, null, canvas.width, canvas.height);
  }

  T.onResize((w, h, d) => {
    W = w; H = h; dpr = d;
    document.documentElement.style.setProperty('--mx', Math.round(Math.max(22, Math.min(W * 0.05, 72))) + 'px');
    if (gl) {
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      const s = Math.min(1, 1150 / Math.max(W, H));
      lowW = Math.round(W * s); lowH = Math.round(H * s);
      target = T.target(gl, lowW, lowH, target);
    }
    if (loop) render(loop.time);
  });

  loop = T.loop((t, dt) => {
    const P = T.pointer;
    P.step(dt, 0.6);
    air[0] = P.sx * canvas.width; air[1] = (1 - P.sy) * canvas.height;
    air[2] = P.vx * canvas.width * 0.6; air[3] = -P.vy * canvas.height * 0.6;
    if (!scrubbing && shift) {
      idle += dt;
      if (idle > 1.2) { shift *= Math.exp(-dt / 0.8); if (Math.abs(shift) < 0.003) shift = 0; }
    }
    render(t);
  }, { offset: T.hash(edition) * 1000, maxFps: 60 });

  /* Drag across the wall (or use ← →) to move through the day. Let go and the
     light returns to now. */
  let startX = 0, startShift = 0, room = null, back = 0;
  const blocked = e => e.target.closest('a,button,#room');
  addEventListener('pointerdown', e => {
    if (blocked(e) || (room && room.open)) return;
    scrubbing = true; startX = e.clientX; startShift = shift;
    document.body.classList.add('is-scrubbing');
  });
  addEventListener('pointermove', e => {
    if (!scrubbing) return;
    shift = clamp(startShift + (e.clientX - startX) / W * 24, -24, 24);
    if (T.reduced()) render(loop.time);
  });
  const release = () => {
    if (!scrubbing) return;
    scrubbing = false; idle = 0; document.body.classList.remove('is-scrubbing');
    if (T.reduced()) { shift = 0; render(loop.time); }
  };
  addEventListener('pointerup', release); addEventListener('pointercancel', release);
  addEventListener('keydown', e => {
    if ((room && room.open) || e.altKey || e.metaKey || e.ctrlKey) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    shift = clamp(shift + (e.key === 'ArrowRight' ? 0.5 : -0.5), -24, 24); idle = 0;
    if (T.reduced()) { render(loop.time); clearTimeout(back); back = setTimeout(() => { shift = 0; render(loop.time); }, 2500); }
  });

  let still = 0;
  function setMotion() {
    clearInterval(still);
    if (T.reduced()) { loop.stop(); render(loop.time); still = setInterval(() => render(loop.time), 60000); }
    else loop.start();
  }
  T.onMotionChange(setMotion);
  setMotion();
  render(loop.time);
  document.body.classList.add('is-ready');

  room = T.room({ trigger: document.getElementById('enter'), onEnter() { loop.fps(24); }, onLeave() { loop.fps(60); } });
})();
</script>
</body>
</html>
