<script>
(function () {
  'use strict';
  const T = Tangerine, canvas = document.getElementById('light');
  const visit = T.visit('living-light', 6);
  const rnd = T.rng(visit.seed);
  const params = new URLSearchParams(location.search);

  /* ----- The hour decides the light -----
     Dawn is pink and low, midday pale and high, late afternoon tangerine,
     dusk vermilion, night a pale moon on a blue wall with a lamp still on. */
  const L = T.hexToLin;
  const keys = [
    { h: 0,    sun: L('#aebfe0'), si: 0.42, amb: L('#25324a'), ai: 0.55, lamp: 0.9, alt: 0.55, prism: 0 },
    { h: 5,    sun: L('#aebfe0'), si: 0.40, amb: L('#2c3650'), ai: 0.6,  lamp: 0.8, alt: 0.5,  prism: 0 },
    { h: 6.5,  sun: L('#ffbca6'), si: 1.45, amb: L('#b5abc4'), ai: 0.56, lamp: 0.1, alt: 0.25, prism: 0.6 },
    { h: 9,    sun: L('#ffe3c2'), si: 1.6,  amb: L('#cfc6ba'), ai: 0.62, lamp: 0,   alt: 0.55, prism: 1 },
    { h: 13,   sun: L('#fff0dc'), si: 1.7,  amb: L('#d5cfc3'), ai: 0.66, lamp: 0,   alt: 0.85, prism: 1 },
    { h: 16,   sun: L('#ffc386'), si: 1.85, amb: L('#cdb7a2'), ai: 0.6,  lamp: 0,   alt: 0.5,  prism: 1 },
    { h: 18,   sun: L('#ffa060'), si: 1.75, amb: L('#bb9d8a'), ai: 0.52, lamp: 0.05,alt: 0.28, prism: 0.7 },
    { h: 19.5, sun: L('#ff7a58'), si: 1.25, amb: L('#7f7290'), ai: 0.46, lamp: 0.45,alt: 0.18, prism: 0 },
    { h: 21,   sun: L('#aebfe0'), si: 0.42, amb: L('#2a3550'), ai: 0.55, lamp: 0.9, alt: 0.55, prism: 0 },
    { h: 24,   sun: L('#aebfe0'), si: 0.42, amb: L('#25324a'), ai: 0.55, lamp: 0.9, alt: 0.55, prism: 0 }
  ];
  function lightAt(hour) {
    let i = 0; while (i < keys.length - 2 && keys[i + 1].h <= hour) i++;
    const a = keys[i], b = keys[i + 1], k = Math.min(1, Math.max(0, (hour - a.h) / (b.h - a.h)));
    const s = k * k * (3 - 2 * k), mix = (x, y) => x + (y - x) * s, mix3 = (x, y) => x.map((v, j) => mix(v, y[j]));
    return { sun: mix3(a.sun, b.sun), si: mix(a.si, b.si), amb: mix3(a.amb, b.amb), ai: mix(a.ai, b.ai), lamp: mix(a.lamp, b.lamp), alt: mix(a.alt, b.alt), prism: mix(a.prism, b.prism) };
  }
  const hourNow = () => (params.has('hour') ? parseFloat(params.get('hour')) : T.dayPhase() * 24);

  /* ----- This visit's window ----- */
  const win = {
    transom: [3, 4, 4, 5][Math.floor(rnd() * 4)],
    curtain: rnd() < 0.6,
    side: rnd() < 0.5 ? -1 : 1,          // which way the light leans
    prismAt: [0.07 + rnd() * 0.1, 0.42 + rnd() * 0.2],
    glass: rnd() * 100
  };

  /* ----- Lettering on the glass, as a texture ----- */
  function letteringTexture(gl) {
    const c = document.createElement('canvas'); c.width = 2048; c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, 2048, 512);
    const path = new Path2D(document.querySelector('#wm path').getAttribute('d'));
    const s = 1840 / 1393;
    g.translate((2048 - 1393 * s) / 2, (512 - 295 * s) / 2);
    g.scale(s, s);
    g.fillStyle = '#fff'; g.fill(path, 'evenodd');
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, gl.LUMINANCE, gl.UNSIGNED_BYTE, c);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
  }

  const gl = T.gl(canvas);
  if (!gl) { document.body.classList.add('is-ready'); return; }

  const WALL = T.glslNoise + `
uniform vec2 uRes; uniform float uTime, uSeed;
uniform vec3 uO; uniform vec4 uInv;     // wall -> window: uv = inv * (p - O)
uniform vec2 uLen;                      // window edge lengths on the wall
uniform vec3 uSun; uniform vec3 uAmb; uniform float uLamp, uCloud, uSoft, uPrism, uCurtain, uSide;
uniform float uTransom; uniform vec2 uPrismAt; uniform float uGlass;
uniform sampler2D uWord;
varying vec2 vUv;

// signed distance (wall units, + inside) to the panes of a shopfront window:
// a row of small transom lights over one large plate of glass.
float panes(vec2 uv){
  float dx=min(uv.x,1.-uv.x)*uLen.x, dy=min(uv.y,1.-uv.y)*uLen.y;
  float d=min(dx,dy);
  float vt=.24;                                           // transom bar position (from top)
  float bar=abs(uv.y-vt)*uLen.y-.013;
  d=min(d,bar);
  if(uv.y<vt){
    float cell=uv.x*uTransom; float m=abs(fract(cell+.5)-.5)/uTransom*uLen.x-.0062;
    d=min(d,m);
  }
  return d;
}

void main(){
  float asp=uRes.x/uRes.y;
  vec2 p=vec2(vUv.x*asp,vUv.y);
  float t=uTime;

  // plaster: uneven albedo and a little relief
  float pl=fbm(p*5.+uSeed), pl2=fbm3(p*23.-uSeed);
  vec3 albedo=vec3(.92,.86,.78)*(.955+.06*pl+.03*pl2);

  // where on the window does this bit of wall look back to?
  vec2 q=p-uO.xy;
  vec2 uv=vec2(dot(uInv.xy,q),dot(uInv.zw,q));

  // penumbra widens with distance from the sill and when a cloud thins the sun
  float soft=uSoft*(.65+.7*uv.y)*(1.+uCloud*2.2);
  float d=panes(uv);
  float lit=smoothstep(-soft,soft,d);

  // old glass is never flat: the light ripples a little
  float wav=fbm3(vec2(uv.x*3.,uv.y*11.)+uGlass+t*.002);
  lit*=1.+(wav-.5)*.12;
  lit*=1.06-.14*clamp(uv.y,0.,1.);                       // brighter nearer the window

  // the lettering on the large pane casts its shadow
  float wordW=.8, wordH=wordW*(512./2048.)*uLen.x/uLen.y;
  vec2 wv=vec2((uv.x-(1.-wordW)*.5)/wordW,(uv.y-.5)/wordH);
  float blur=log2(1.+soft*900.)-.6;
  float letters=0.;
  if(wv.x>0.&&wv.x<1.&&wv.y>0.&&wv.y<1.) letters=texture2D(uWord,vec2(wv.x,wv.y),blur).r;
  lit*=1.-letters*.9;

  // a sheer curtain drawn to one side, moving in the air from the open window
  float edgeU=uSide>0.?uv.x:1.-uv.x;
  float cEdge=.2+.035*sin(uv.y*3.1+t*.21)+.02*sin(uv.y*7.3-t*.33);
  float inCurtain=(1.-smoothstep(cEdge-.03,cEdge+.03,edgeU))*uCurtain;
  float folds=.5+.5*sin(edgeU*70.+sin(t*.27+uv.y*4.)*1.6+sin(t*.13)*2.);
  lit*=1.-inCurtain*(.38+.22*folds);

  // a passing cloud
  lit*=1.-uCloud*.55;

  // the halo the bright patch spreads around itself
  float glow=smoothstep(-soft*14.-.05,soft*10.+.07,d)*(1.-uCloud*.5);

  vec3 light=uAmb*(.8+.28*vUv.y)              // sky fill, stronger toward the ceiling
            +uSun*.075                            // sun bounced around the room
            +uSun*lit
            +uSun*glow*.09;
  // a lamp left on, low in the room
  vec2 lp=vec2(-.15,-.25);
  float ld=length((p-lp)*vec2(.8,1.));
  light+=vec3(1.,.48,.16)*uLamp*.55*exp(-ld*ld*1.6);

  // raking light picks up the plaster relief inside the patch
  float bump=(fbm3(p*40.+3.)-.5);
  light*=1.+bump*lit*.06;

  // a small rainbow thrown by a glass on the sill
  vec2 pr=p-vec2(uPrismAt.x*asp,uPrismAt.y);
  pr=mat2(.94,-.34,.34,.94)*pr;
  float band=exp(-pow(pr.y/.05,2.))*exp(-pow(pr.x/.11,2.));
  pr.y+=pr.x*pr.x*.6;
  float along=clamp(pr.y/.1+.5,0.,1.);
  vec3 spec=clamp(vec3(1.5-abs(along*4.-3.2),1.5-abs(along*4.-2.),1.5-abs(along*4.-.8))-.5,0.,1.);
  light+=spec*band*uPrism*.45*(1.-uCloud)*(1.-smoothstep(-.02,.0,d));

  vec3 col=albedo*light;
  col=1.-exp(-col*1.55);                       // highlights roll off like film
  gl_FragColor=vec4(toSrgb(col),clamp(lit*(1.-letters),0.,1.));
}`;

  const LENS = T.glslNoise + T.glslGrain + `
uniform sampler2D uTex; uniform vec2 uRes; uniform float uTime, uDpr, uSeed, uMotes;
uniform vec4 uAir;           // cursor px (x,y) and its velocity (px/s)
varying vec2 vUv;

// one layer of dust: one mote at most per cell, wandering, glinting in the sun
float motes(vec2 px,float cell,float speed,float seed){
  vec2 dpx=uAir.xy-px; float near=exp(-dot(dpx,dpx)/(160.*160.*uDpr*uDpr));
  px-=uAir.zw*near*.35;                                    // the air a hand moves
  vec2 drift=vec2(sin(uTime*.05+seed)*30.,uTime*speed);
  vec2 g=(px+drift)/cell; vec2 id=floor(g); vec2 f=fract(g);
  float h=h21(id+seed);
  if(h>.2) return 0.;
  float h2=h21(id+seed+7.1), h3=h21(id+seed+3.3);
  vec2 c=vec2(.3+.4*h2,.3+.4*h3)+.12*vec2(sin(uTime*(.2+h2*.3)+h*30.),cos(uTime*(.17+h3*.3)+h*20.));
  float r=(.5+h2*1.1)*uDpr/cell;
  float dd=length(f-c);
  float glint=.35+.65*pow(.5+.5*sin(uTime*(.6+h3*1.4)+h*50.),4.);
  return smoothstep(r,r*.15,dd)*glint;
}

void main(){
  vec2 px=gl_FragCoord.xy;
  vec4 s=texture2D(uTex,vUv);
  vec3 c=s.rgb;
  float beam=smoothstep(.15,.8,s.a);
  float m=motes(px,46.*uDpr,9.*uDpr,uSeed)*.9+motes(px,83.*uDpr,14.*uDpr,uSeed+11.)*.6;
  c+=vec3(1.,.95,.86)*m*beam*.32*uMotes;
  c=applyGrain(c,px,uSeed,.06);
  gl_FragColor=vec4(c,1.);
}`;

  const wall = T.program(gl, WALL), lens = T.program(gl, LENS);
  const word = letteringTexture(gl);
  let W = 0, H = 0, dpr = 1, lowW = 0, lowH = 0, target = null, loop = null, geo = null;

  /* The window's footprint on the wall: a parallelogram that leans with the sun
     and creeps across the wall as the afternoon goes on. */
  function geometry(W, H, t, light) {
    const asp = W / H, portrait = asp < 0.9;
    const w = portrait ? asp * 1.04 : Math.min(asp * 0.74, 1.3);
    const h = portrait ? 0.64 : 0.98 + (light.alt - 0.5) * 0.2;
    const lean = win.side * (0.32 - light.alt * 0.18) + Math.sin(t / 380) * 0.02;
    const creep = Math.sin(t / 520 + win.glass) * 0.025;
    const cx = (portrait ? asp * 0.5 : asp * (win.side > 0 ? 0.6 : 0.52)) + creep, cy = portrait ? 0.62 : 0.62;
    // U runs along the top of the window, V down its side (sheared by the lean)
    const U = [w, 0.0], V = [lean * h, -h];
    const O = [cx - U[0] / 2 - V[0] / 2, cy - U[1] / 2 - V[1] / 2];
    const det = U[0] * V[1] - U[1] * V[0];
    const inv = [V[1] / det, -V[0] / det, -U[1] / det, U[0] / det];
    return { O, inv, len: [Math.hypot(U[0], U[1]), Math.hypot(V[0], V[1])] };
  }

  T.onResize((w, h, d) => {
    W = w; H = h; dpr = d;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const s = Math.min(1, 1150 / Math.max(W, H));
    lowW = Math.round(W * s); lowH = Math.round(H * s);
    target = T.target(gl, lowW, lowH, target);
    document.documentElement.style.setProperty('--mx', Math.round(Math.max(22, Math.min(W * 0.05, 72))) + 'px');
    if (loop) render(loop.time, 0);
  });

  let air = [0, 0, 0, 0], night = null;
  function render(t) {
    const light = lightAt(hourNow());
    const isNight = light.si < 0.7;
    if (isNight !== night) {
      night = isNight;
      document.body.classList.toggle('is-night', night);
      document.documentElement.style.setProperty('--text', night ? '#e9e1d4' : '#2b231d');
      document.querySelector('meta[name=theme-color]').content = night ? '#1f2636' : '#e9dccb';
      document.body.style.background = night ? '#1f2636' : '#e9dccb';
    }
    const g = geometry(W, H, t, light);
    // clouds: rare, slow, partial
    const n = Math.sin(t * 0.021 + visit.seed) * 0.5 + Math.sin(t * 0.0131 + 2.1) * 0.35 + Math.sin(t * 0.0057) * 0.15;
    const cloud = T.reduced() ? 0 : Math.max(0, Math.min(1, (n - 0.45) / 0.3)) * 0.85;

    gl.useProgram(wall);
    gl.uniform2f(wall.u('uRes'), lowW, lowH);
    gl.uniform1f(wall.u('uTime'), t);
    gl.uniform1f(wall.u('uSeed'), (visit.seed % 1000) / 41);
    gl.uniform3f(wall.u('uO'), g.O[0], g.O[1], 0);
    gl.uniform4f(wall.u('uInv'), g.inv[0], g.inv[1], g.inv[2], g.inv[3]);
    gl.uniform2f(wall.u('uLen'), g.len[0], g.len[1]);
    gl.uniform3fv(wall.u('uSun'), light.sun.map(v => v * light.si));
    gl.uniform3fv(wall.u('uAmb'), light.amb.map(v => v * light.ai));
    gl.uniform1f(wall.u('uLamp'), light.lamp);
    gl.uniform1f(wall.u('uCloud'), cloud);
    gl.uniform1f(wall.u('uSoft'), 0.0035);
    gl.uniform1f(wall.u('uPrism'), light.prism * (visit.index % 2 === 0 ? 1 : 0));
    gl.uniform1f(wall.u('uCurtain'), win.curtain ? 1 : 0);
    gl.uniform1f(wall.u('uSide'), win.side);
    gl.uniform1f(wall.u('uTransom'), win.transom);
    gl.uniform2f(wall.u('uPrismAt'), win.prismAt[0], win.prismAt[1]);
    gl.uniform1f(wall.u('uGlass'), win.glass);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, word);
    gl.uniform1i(wall.u('uWord'), 1);
    T.draw(gl, wall, target, lowW, lowH);

    gl.useProgram(lens);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, target.tex);
    gl.uniform1i(lens.u('uTex'), 0);
    gl.uniform2f(lens.u('uRes'), canvas.width, canvas.height);
    gl.uniform1f(lens.u('uTime'), t);
    gl.uniform1f(lens.u('uDpr'), dpr);
    gl.uniform1f(lens.u('uSeed'), (visit.seed % 89) + 0.5);
    gl.uniform1f(lens.u('uMotes'), T.reduced() || night ? 0 : 1);
    gl.uniform4f(lens.u('uAir'), air[0], air[1], air[2], air[3]);
    T.draw(gl, lens, null, canvas.width, canvas.height);
  }

  const startAt = rnd() * 2000;
  loop = T.loop((t, dt) => {
    const P = T.pointer;
    P.step(dt, 0.6);
    air = [P.sx * canvas.width, (1 - P.sy) * canvas.height, P.vx * canvas.width * 0.6, -P.vy * canvas.height * 0.6];
    render(t);
  }, { offset: startAt, maxFps: 60 });

  let still = 0;
  function setMotion() {
    clearInterval(still);
    if (T.reduced()) { loop.stop(); render(loop.time); still = setInterval(() => render(loop.time), 60000); }
    else loop.start();
  }
  T.onMotionChange(setMotion);
  setMotion();
  render(loop.time);
  document.body.classList.add('is-ready');

  T.room({ trigger: document.getElementById('enter'), onEnter() { loop.fps(24); }, onLeave() { loop.fps(60); } });
})();
</script>
</body>
</html>
