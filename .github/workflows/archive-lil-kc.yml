name: Complete Lil KC master archive
on:
  push:
    branches: [main]
    paths:
      - 'lil-kc/.upload/**'
      - '.github/workflows/archive-lil-kc.yml'
permissions:
  contents: write
jobs:
  assemble-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact PNG and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cat lil-kc/.upload/part-*.b64 | base64 --decode > lil-kc/lil-kc-master-2026-11-16.png
          echo "9b9687e5ad8cff0267dc6625883b60dda8ff215c5eb40bb5d778128d35306690  lil-kc/lil-kc-master-2026-11-16.png" | sha256sum --check
          rm -rf lil-kc/.upload
          rm .github/workflows/archive-lil-kc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lil-kc .github/workflows/archive-lil-kc.yml
          git diff --cached --quiet || git commit -m "archive: complete original Lil KC master PNG"
          git push origin HEAD:main
