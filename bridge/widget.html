<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABLET</title>
<style>
  /* TABLET, inline in the conversation. The Tangerine system, condensed:
     white field, hairlines, one tangerine signal (NOW), mono metadata. */
  :root {
    --paper: #fafbfb; --paper-2: #f2f3f3; --ink: #181a1b; --ink-2: #4a4e50; --grey: #868b8d; --grey-2: #b7bbbc; --rule: #dfe2e2; --tangerine: #f25a28;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #141516; --paper-2: #1c1e1f; --ink: #eef0f0; --ink-2: #b8bcbe; --grey: #8a8f91; --grey-2: #4c5052; --rule: #2a2d2e; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #141516; --paper-2: #1c1e1f; --ink: #eef0f0; --ink-2: #b8bcbe; --grey: #8a8f91; --grey-2: #4c5052; --rule: #2a2d2e; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  .t { font: 400 10.5px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--grey); font-variant-numeric: tabular-nums; }
  .card { border: 1px solid var(--rule); padding: 16px 18px 14px; }
  header { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  header .mark { width: 16px; height: 16px; }
  header .mark circle { fill: none; stroke: var(--ink); stroke-width: 1; }
  header .mark line { stroke: var(--tangerine); stroke-width: 2; transform-origin: 8px 8px; }
  header.busy .mark line { animation: sweep 900ms cubic-bezier(.4,0,.2,1) 1; }
  @keyframes sweep { to { transform: rotate(360deg); } }
  header b { font: 500 14px/1 var(--sans); letter-spacing: -.01em; }
  header .grow { flex: 1; }
  button.link, a.link { background: none; border: 0; padding: 0; font: inherit; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--grey-2); text-underline-offset: 2px; cursor: pointer; letter-spacing: inherit; text-transform: inherit; }
  button.link:hover, a.link:hover { color: var(--ink); }
  .grid { display: grid; grid-template-columns: 210px 1fr; gap: 20px; margin-top: 14px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .orbit { max-width: 240px; margin: 0 auto; } }
  .orbit svg { width: 100%; height: auto; display: block; }
  .orbit .ring { fill: none; stroke: var(--rule); }
  .orbit .ray { stroke: var(--rule); }
  .orbit .sat { fill: var(--paper); stroke: var(--grey); }
  .orbit .sat.new { fill: var(--ink); stroke: var(--ink); }
  .orbit .core { fill: var(--tangerine); }
  .orbit text { font: 9px var(--mono); letter-spacing: .06em; fill: var(--grey); text-transform: uppercase; }
  .orbit .sats { transform-origin: 105px 105px; animation: settle 900ms cubic-bezier(.2,.7,.15,1) both; }
  @keyframes settle { from { transform: rotate(-24deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .now { margin-bottom: 14px; }
  .now .t { color: var(--tangerine); display: flex; align-items: center; gap: 6px; }
  .now .t::before { content: ""; width: 6px; height: 6px; background: var(--tangerine); }
  .now h2 { margin: 4px 0 0; font: 500 19px/1.25 var(--sans); letter-spacing: -.01em; }
  .now .ctx { margin-top: 2px; }
  section + section { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
  .label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
  li .k { flex: none; width: 46px; }
  li .x { flex: 1; min-width: 0; }
  li .acts { flex: none; }
  .q { font: 400 13px/1.45 var(--serif); color: var(--ink-2); margin-top: 1px; }
  .changes li .op { flex: none; width: 70px; }
  .changes li.undone .x { color: var(--grey); text-decoration: line-through; text-decoration-color: var(--grey-2); }
  .serif { font: 400 14.5px/1.4 var(--serif); }
  .tick { display: inline-block; width: 8px; height: 8px; border: 1px solid var(--ink); margin-right: 6px; transform: translateY(0); }
  .foot { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .empty { color: var(--grey); padding: 18px 0 6px; }
  .err { color: var(--ink); border-left: 2px solid var(--tangerine); padding-left: 10px; margin-top: 12px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="card" id="root">
  <header id="head"><svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="1.5" x2="8" y2="4.5"/></svg><b>TABLET</b><span class="t">by tangerine</span><span class="grow"></span><span class="t" id="state">Waiting…</span></header>
  <div id="body"><p class="empty">Waiting for Tangerine…</p></div>
</div>
<script>
(function () {
  'use strict';
  /* ---------- host bridge: MCP Apps (postMessage JSON-RPC), with the ChatGPT window.openai fallback ---------- */
  var nextId = 1, pending = {}, data = null, undone = {}, kept = {};
  function post(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) {} }
  function request(method, params) {
    var id = nextId++;
    post({ jsonrpc: '2.0', id: id, method: method, params: params || {} });
    return new Promise(function (ok, no) { pending[id] = { ok: ok, no: no }; setTimeout(function () { if (pending[id]) { delete pending[id]; no(new Error('No answer from host')); } }, 15000); });
  }
  function notify(method, params) { post({ jsonrpc: '2.0', method: method, params: params || {} }); }
  window.addEventListener('message', function (ev) {
    var m = ev.data; if (!m || m.jsonrpc !== '2.0') return;
    if (m.id && pending[m.id] && !m.method) { var p = pending[m.id]; delete pending[m.id]; if (m.error) p.no(new Error(m.error.message || 'error')); else p.ok(m.result); return; }
    if (m.method === 'ui/notifications/tool-result') { receive(m.params); }
    if (m.method === 'ui/notifications/tool-input') { setState('Updating…'); document.getElementById('head').classList.add('busy'); }
    if (m.method === 'ui/notifications/host-context-changed' && m.params && m.params.theme) document.documentElement.setAttribute('data-theme', m.params.theme);
  });
  var openai = window.openai;
  function callTool(name, args) {
    if (openai && typeof openai.callTool === 'function') return openai.callTool(name, args);
    return request('tools/call', { name: name, arguments: args });
  }
  function openLink(url) {
    if (openai && typeof openai.openExternal === 'function') return openai.openExternal({ href: url });
    return request('ui/open-link', { url: url }).catch(function () { window.open(url, '_blank', 'noopener'); });
  }
  function receive(result) {
    var sc = result && (result.structuredContent || result);
    if (!sc || !sc.mode) return;
    if (sc.mode === 'error') { data = data || null; renderError(sc.errors || []); return; }
    data = sc; render();
  }
  function resize() { var h = document.documentElement.scrollHeight; notify('ui/notifications/size-changed', { height: h }); if (openai && openai.notifyIntrinsicHeight) try { openai.notifyIntrinsicHeight(h); } catch (e) {} }

  /* ---------- view ---------- */
  var KIND = { project: 'Project', person: 'Person', idea: 'Idea', decision: 'Decision', action: 'Action', question: 'Open' };
  var OP = { added: 'Added', updated: 'Updated', done: 'Done', suggested: 'Suggested' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function setState(t) { document.getElementById('state').textContent = t; }

  function orbitSVG(d) {
    // NOW at the centre; projects on the inner ring, everything else changed this time on the outer.
    var C = 105, sats = [], i;
    var projects = (d.projects || []).slice(0, 6);
    var fresh = (d.changes || []).filter(function (c) { return c.op !== 'suggested'; }).slice(0, 10);
    for (i = 0; i < projects.length; i++) { var a = -Math.PI / 2 + (i + .5) * 2 * Math.PI / Math.max(projects.length, 1); sats.push({ x: C + Math.cos(a) * 52, y: C + Math.sin(a) * 52, r: 5, cls: 'sat', label: projects[i].ref }); }
    for (i = 0; i < fresh.length; i++) { var b = -Math.PI / 2 + i * 2 * Math.PI / Math.max(fresh.length, 1) + .2; sats.push({ x: C + Math.cos(b) * 88, y: C + Math.sin(b) * 88, r: 3.2, cls: 'sat new' }); }
    var s = '<svg viewBox="0 0 210 210" role="img" aria-label="TABLET orbit: ' + projects.length + ' projects, ' + fresh.length + ' changes this update">';
    s += '<circle class="ring" cx="105" cy="105" r="52"/><circle class="ring" cx="105" cy="105" r="88"/>';
    s += '<g class="sats">';
    sats.forEach(function (t) { s += '<line class="ray" x1="105" y1="105" x2="' + t.x.toFixed(1) + '" y2="' + t.y.toFixed(1) + '"/>'; });
    sats.forEach(function (t) { s += '<circle class="' + t.cls + '" cx="' + t.x.toFixed(1) + '" cy="' + t.y.toFixed(1) + '" r="' + t.r + '"/>' + (t.label ? '<text x="' + (t.x + 8).toFixed(1) + '" y="' + (t.y + 3).toFixed(1) + '">' + esc(t.label) + '</text>' : ''); });
    s += '</g><circle class="core" cx="105" cy="105" r="' + (d.now ? 5 : 2.5) + '"/></svg>';
    return s;
  }

  function row(x, extra) {
    return '<li><span class="k t">' + esc(x.ref || KIND[x.kind] || '') + '</span><span class="x">' + (x.kind === 'action' ? '<span class="tick"></span>' : '') + esc(x.title) +
      (x.when ? ' <span class="t">“' + esc(x.when) + '”</span>' : '') + (x.context ? ' <span class="t">· ' + esc(x.context) + '</span>' : '') + '</span>' + (extra || '') + '</li>';
  }

  function render() {
    var d = data, h = '';
    document.getElementById('head').classList.remove('busy');
    var nC = (d.changes || []).filter(function (c) { return c.op !== 'suggested'; }).length;
    setState(d.mode === 'update' ? nC + ' change' + (nC === 1 ? '' : 's') + ' · ' + new Date().toTimeString().slice(0, 5) : 'Current picture');
    h += '<div class="grid"><div class="orbit">' + orbitSVG(d) + '</div><div>';
    if (d.now) h += '<div class="now"><span class="t">Now</span><h2>' + esc(d.now.title) + '</h2>' + (d.now.context ? '<div class="ctx t">For · ' + esc(d.now.context) + '</div>' : '') + '</div>';
    if (d.mode === 'update' && d.changes && d.changes.length) {
      h += '<section class="changes"><div class="label t"><span>From this conversation</span><span>' + nC + '</span></div><ul>';
      d.changes.forEach(function (c) {
        var un = undone[c.proposalId], kp = kept[c.proposalId];
        var act = c.op === 'suggested' && !kp ? '<button class="link t" data-keep="' + esc(c.proposalId) + '">Keep</button>' : un ? '<span class="t">Undone</span>' : '<button class="link t" data-undo="' + esc(c.proposalId) + '">Undo</button>';
        h += '<li class="' + (un ? 'undone' : '') + '"><span class="op t">' + (kp ? 'Kept' : OP[c.op] || c.op) + '</span><span class="x">' + esc(c.title) + ' <span class="t">· ' + esc(KIND[c.kind] || c.kind) + (c.said === 'chatgpt' ? ' · ChatGPT suggested' : '') + '</span></span><span class="acts">' + act + '</span></li>';
      });
      h += '</ul></section>';
    }
    if (d.next && d.next.length) { h += '<section><div class="label t"><span>Next</span><span>' + d.next.length + (d.moreNext ? ' of ' + (d.next.length + d.moreNext) : '') + '</span></div><ul>' + d.next.map(function (x) { return row(x); }).join('') + '</ul></section>'; }
    if (d.openLoops && d.openLoops.length && d.mode !== 'update') { h += '<section><div class="label t"><span>Open loops</span><span>' + d.openLoops.length + '</span></div><ul>' + d.openLoops.map(function (x) { return '<li><span class="k t">' + esc(x.ref) + '</span><span class="x serif">' + esc(x.title) + '</span></li>'; }).join('') + '</ul></section>'; }
    if (d.decisions && d.decisions.length && d.mode !== 'update') { h += '<section><div class="label t"><span>Decided</span></div><ul>' + d.decisions.map(function (x) { return '<li><span class="k t">' + esc(x.ref) + '</span><span class="x serif">' + esc(x.title) + '</span></li>'; }).join('') + '</ul></section>'; }
    if (!d.now && !(d.next || []).length && !(d.changes || []).length) h += '<p class="empty">TABLET is empty. As you talk, ChatGPT will keep it current.</p>';
    h += '</div></div>';
    var c = d.counts || {};
    h += '<div class="foot"><span class="t">' + [c.project + ' projects', c.person + ' people', c.decision + ' decisions', c.question + ' open'].join(' · ') + '</span>' +
      (d.tabletUrl ? '<button class="link t" id="open">Open TABLET ↗</button>' : '') + '</div>';
    h += '<p class="t" style="margin:8px 0 0;text-transform:none;letter-spacing:.02em">Tangerine sees only what ChatGPT sends it, with the words quoted. Undo anything.</p>';
    document.getElementById('body').innerHTML = h;
    resize();
  }
  function renderError(errors) {
    setState('Not updated');
    document.getElementById('body').innerHTML = '<p class="err">Tangerine did not update: ' + esc(errors.join('; ')) + '</p>';
    resize();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'open') { openLink(data.tabletUrl); return; }
    var id = b.getAttribute('data-undo') || b.getAttribute('data-keep');
    if (!id) return;
    var undo = b.hasAttribute('data-undo');
    b.disabled = true; b.textContent = '…';
    callTool(undo ? 'tangerine_undo' : 'tangerine_keep', { proposalId: id }).then(function (r) {
      if (undo) undone[id] = true; else kept[id] = true;
      var sc = r && (r.structuredContent || (r.result && r.result.structuredContent));
      if (sc && sc.mode === 'view') { var ch = data.changes, m = data.mode; data = sc; data.changes = ch; data.mode = m; }
      render();
    }).catch(function (err) { b.disabled = false; b.textContent = 'Retry'; setState(err.message); });
  });

  /* ---------- start ---------- */
  if (openai && openai.toolOutput) receive({ structuredContent: openai.toolOutput });
  window.addEventListener('openai:set_globals', function () { if (window.openai && window.openai.toolOutput) receive({ structuredContent: window.openai.toolOutput }); });
  request('ui/initialize', { protocolVersion: '2026-01-26', appInfo: { name: 'tangerine-tablet', version: '0.2.0' }, clientInfo: { name: 'tangerine-tablet', version: '0.2.0' }, appCapabilities: { availableDisplayModes: ['inline'] } })
    .then(function (r) {
      var ctx = r && r.hostContext; if (ctx && ctx.theme) document.documentElement.setAttribute('data-theme', ctx.theme);
      notify('ui/notifications/initialized', {});
    }).catch(function () { /* not an MCP Apps host; the window.openai path above may still render */ });
})();
</script>
</body>
</html>
