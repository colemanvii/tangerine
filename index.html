<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ede8dd" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Haven — Morning. A quiet orientation for the day, with representative prototype data."
    />
    <title>Haven — Morning</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23292b25'/%3E%3Cpath d='M12 10v20m16-20v20M12 20h16' stroke='%23f2ede3' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="home-data.js" defer></script>
    <script src="morning-data.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <div class="instrument" id="instrument">
      <header class="masthead">
        <a class="wordmark" href="#home" aria-label="Haven home"
          >HAVEN<span class="brand-rule" aria-hidden="true"></span
        ></a>
        <div class="home-address">
          Cedar House <span>Nashville, Tennessee</span>
        </div>
        <div class="header-actions">
          <button class="demo-button" data-detail="demo">Demo home</button
          ><button
            class="idle-button"
            id="rest"
            aria-label="Enter quiet display"
          >
            <span aria-hidden="true">◐</span> Quiet display
          </button>
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
      <nav class="navigation" aria-label="Main navigation">
        <a href="#home" data-view="home"
          ><span aria-hidden="true">01</span>Home</a
        >
        <a href="#systems" data-view="systems"
          ><span aria-hidden="true">02</span>Systems</a
        >
        <a href="#security" data-view="security"
          ><span aria-hidden="true">03</span>Security</a
        >
        <a href="#household" data-view="household"
          ><span aria-hidden="true">04</span>Household</a
        >
        <a href="#record" data-view="record"
          ><span aria-hidden="true">05</span>Record</a
        >
      </nav>
      <footer class="instrument-footer">
        <span>CEDAR HOUSE <span class="footer-divider">/</span> EST. 2024</span
        ><span>Representative data · Sunday, September 27, 2026 · 1:35 PM</span>
      </footer>
    </div>
    <section class="idle" id="idle" aria-label="Quiet display" hidden></section>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="dialog-top">
        <span class="label">CEDAR HOUSE / DEMO RECORD</span
        ><button class="close-button" aria-label="Close details">✕</button>
      </div>
      <div id="detail-content"></div>
    </dialog>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <noscript
      ><p class="noscript">
        Haven’s interactive demonstration needs JavaScript. This prototype uses
        representative data, not live monitoring.
      </p></noscript
    >
  </body>
</html>
