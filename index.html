<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d8cfbe">
<title>Haven / Year 32</title>
<style>
:root{--paper:#d8cfbe;--ink:#191816;--muted:#6d685f;--rule:#9d9588}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:Monaco,"Lucida Console","Courier New",monospace;-webkit-font-smoothing:antialiased;padding:clamp(20px,4vw,56px)}
main{max-width:880px;margin:0 auto;min-height:calc(100svh - 2 * clamp(20px,4vw,56px));display:flex;flex-direction:column}
header,footer{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
header{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:14px 0}
header strong{font-size:17px;font-weight:400}
time,footer{font-size:10px;color:var(--muted);letter-spacing:.04em}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 0;gap:clamp(34px,6vh,65px)}
section{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:start}
h2{margin:6px 0 0;font-size:11px;text-transform:uppercase;font-weight:400;letter-spacing:.12em;color:var(--muted)}
ol{margin:0;padding:0;list-style:none;display:grid;gap:15px;counter-reset:now}
ol li{font-size:clamp(19px,3.1vw,30px);line-height:1.22;letter-spacing:-.04em}
ol li:before{counter-increment:now;content:"0" counter(now) "  ";font-size:11px;letter-spacing:0;color:var(--muted);vertical-align:middle}
.actions{display:grid;gap:13px}
label{display:flex;align-items:baseline;gap:13px;font-size:clamp(14px,1.75vw,17px);line-height:1.35;cursor:pointer}
input{appearance:none;width:16px;height:16px;border:1px solid var(--ink);background:transparent;margin:0;flex:none;transform:translateY(1px)}
input:checked{background:var(--ink)}
input:checked+span{text-decoration:line-through;color:var(--muted)}
.direction{font-size:clamp(17px,2.3vw,24px);line-height:1.45;letter-spacing:-.025em;max-width:650px;margin:0}
footer{border-top:1px solid var(--rule);padding:13px 0 0}
a{color:inherit;text-underline-offset:3px}
a:hover{color:var(--ink)}
@media(max-width:620px){
section{grid-template-columns:1fr;gap:14px}
.content{justify-content:flex-start;gap:40px;padding:35px 0}
ol li{font-size:22px}
.direction{font-size:19px}
footer{font-size:9px}
}
</style>
</head>
<body>
<main>
<header><strong>hello, Cole.</strong><time id="date"></time></header>
<div class="content">
<section aria-labelledby="now"><h2 id="now">Now</h2><ol>
<li>Find your place.</li>
<li>Do good work at Freeman.</li>
<li>Make art. Live your life.</li>
</ol></section>
<section aria-labelledby="next"><h2 id="next">Next</h2><div class="actions">
<label><input id="housing-choice" type="checkbox"><span>Take the next housing step.</span></label>
<label><input id="matre-contact" type="checkbox"><span>Reach out to Rob Matre.</span></label>
<label><input id="paint-play" type="checkbox"><span>Paint something just for fun.</span></label>
</div></section>
<section aria-labelledby="direction"><h2 id="direction">Direction</h2>
<p class="direction">Less rumination. More participation.<br><br>Make me faithful before You make me successful. Get me back to living in the world.</p></section>
</div>
<footer><span>HAVEN / YEAR 32</span><a href="./full.html">FULL RECORD ↗</a></footer>
</main>
<script>
document.getElementById('date').textContent=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'America/New_York'}).format(new Date()).toUpperCase();
document.querySelectorAll('input[type="checkbox"]').forEach(input=>{const key='haven:simple:'+input.id;try{input.checked=localStorage.getItem(key)==='1'}catch{}input.addEventListener('change',()=>{try{localStorage.setItem(key,input.checked?'1':'0')}catch{}})});
</script>
</body>
</html>
