<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study B — The Living Index</title>
<link rel="stylesheet" href="base.css">
<style>
body{min-height:100svh}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:26px 36px 0}
.top img{width:150px}
.top .sys{padding-top:10px}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;padding:6vh 36px 60px}
.idx{list-style:none;margin:0;padding:0}
.e{display:grid;grid-template-columns:44px 1fr;column-gap:8px;padding:18px 0 22px;border-top:1px solid var(--rule)}
.e:last-child{border-bottom:1px solid var(--rule)}
.e .no{font:500 11px/2.6 var(--sans);font-stretch:112%;color:var(--orange-ink)}
.e h2{margin:0;font:400 clamp(34px,3.6vw,56px)/1 var(--serif);letter-spacing:-.012em;transition:color .12s}
.e:not(.on) h2{color:var(--ink-2)}
.e .meta{grid-column:2;margin:6px 0 10px}
.run{grid-column:2;margin:0;font:400 15px/1.75 var(--sans);font-stretch:100%;color:var(--ink-2);max-width:62ch}
.run a{white-space:normal;transition:color .08s}
.run a sup{font:500 8.5px/1 var(--sans);font-stretch:112%;letter-spacing:.04em;color:var(--ink-3);margin:0 3px 0 1px;vertical-align:.55em}
.run a:hover,.run a.on{color:var(--ink)}
.run a.on{box-shadow:inset 0 -1px 0 var(--orange)}
.run .sep{color:var(--rule);margin:0 6px}
.fig{position:sticky;top:12vh;align-self:start;height:76vh;display:flex;flex-direction:column;justify-content:center}
.fig .frame{flex:1;min-height:0;display:flex;align-items:center;justify-content:flex-start}
.fig img,.fig video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform-origin:left center}
.fig .swap{animation:sw .16s var(--ease)}
@keyframes sw{from{opacity:.25;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.q{font:400 48px/1 var(--serif);max-width:11em}
.fig .cap{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:14px}
.fig .cap h3{margin:0;font:400 20px/1.15 var(--serif)}
.fig .cap .sys{grid-column:2}
.foot{display:flex;justify-content:space-between;padding:0 36px 26px;color:var(--ink-3)}
.blink{display:inline-block;width:6px;height:10px;background:var(--orange);margin-left:6px;vertical-align:-1px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(max-width:860px){
 .top{padding:18px 16px 0}.top img{width:120px}
 .wrap{display:block;padding:24px 16px}
 .fig{position:static;height:auto;margin:0 0 8px}
 .fig .frame{height:46svh;justify-content:center}
 .e{grid-template-columns:30px 1fr}.e h2{font-size:34px}
 .foot{padding:0 16px 24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top"><img src="/media/brand/tangerine-script-480.webp" alt="Tangerine"><span class="sys mute">We build brands.</span></header>
<div class="wrap">
 <ol class="idx" id="idx"></ol>
 <figure class="fig" id="fig" aria-live="polite"><div class="frame" id="frame"></div><figcaption class="cap"><span class="sys o" id="fn"></span><h3 id="ft"></h3><span class="sys mute" id="ff"></span></figcaption></figure>
</div>
<footer class="foot sys"><span>Index 002</span><span id="log"></span></footer>
<script>
(async () => {
 const D = await (await fetch('/data/archive.json')).json();
 const A = D.artifacts, R = D.rels;
 const idx = document.getElementById('idx');
 idx.innerHTML = R.map((x, k) => `<li class="e" data-rel="${x.slug}"><span class="no">${x.no}</span><h2>${x.name}</h2>
  <span class="meta sys mute">${x.since} · ${x.status} · ${String(x.count).padStart(2,'0')}</span>
  <p class="run">${A.filter(a => a.rel === x.slug).map(a => `<a href="${a.dossier}" data-g="${a.g}"><sup>${a.n}</sup>${a.text}</a>`).join('<span class="sep">/</span>')}</p></li>`).join('');
 document.getElementById('log').innerHTML = `${A.length} entries · updated ${D.updated.split('-').reverse().join('.')}<span class="blink"></span>`;
 let cur = -1;
 function show(g) {
  if (g === cur) return; cur = g; const a = A[g];
  document.querySelectorAll('.run a').forEach(el => el.classList.toggle('on', +el.dataset.g === g));
  document.querySelectorAll('.e').forEach(el => el.classList.toggle('on', el.dataset.rel === a.rel));
  const f = document.getElementById('frame');
  f.innerHTML = a.kind === 'quote' ? `<div class="q swap">${a.quote}</div>` : a.kind === 'video' ? `<video class="swap" src="${a.video}" poster="${a.src}" muted loop playsinline autoplay></video>` : `<img class="swap" src="${a.src}" srcset="${a.srcset}" sizes="45vw" alt="${a.alt}">`;
  fn.textContent = `${a.code} ${a.n}`; ft.innerHTML = a.title; ff.textContent = [a.disc.join(', '), a.date, a.status].filter(Boolean).join(' · ');
 }
 idx.addEventListener('pointerover', e => { const l = e.target.closest('[data-g]'); if (l) show(+l.dataset.g); });
 idx.addEventListener('focusin', e => { const l = e.target.closest('[data-g]'); if (l) show(+l.dataset.g); });
 idx.addEventListener('click', e => { const l = e.target.closest('[data-g]'); if (l && matchMedia('(hover:none)').matches && cur !== +l.dataset.g) { e.preventDefault(); show(+l.dataset.g); scrollTo({top:0,behavior:'smooth'}); } });
 addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); show(Math.min(cur + 1, A.length - 1)); } if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); show(Math.max(cur - 1, 0)); } });
 show(0);
})();
</script>
</body></html>
