<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study A — The Instrument</title>
<link rel="stylesheet" href="base.css">
<style>
body{height:100svh;overflow:hidden;display:grid;grid-template-columns:clamp(320px,29vw,440px) 1fr}
.ctl{display:grid;grid-template-rows:auto 1fr auto;border-right:1px solid var(--ink);padding:28px 28px 22px}
.mark img{width:200px}
.decl{margin:10px 0 0;font:italic 400 17px/1.2 var(--serif);color:var(--ink-2)}
.rels{list-style:none;margin:0;padding:0;align-self:center}
.rel{position:relative;padding:14px 0 14px 18px;border-top:1px solid var(--rule)}
.rel:last-child{border-bottom:1px solid var(--rule)}
.rel::before{content:"";position:absolute;left:0;top:18px;width:2px;height:22px;background:var(--orange);transform:scaleY(0);transition:transform .18s var(--ease)}
.rel[aria-current]::before{transform:none}
.rel button{display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;width:100%;text-align:left}
.rel .nm{font:400 21px/1.1 var(--sans);font-stretch:104%;letter-spacing:-.012em;transition:color .12s}
.rel:not([aria-current]) .nm{color:var(--ink-2)}
.rel button:hover .nm{color:var(--ink)}
.ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:0;overflow:hidden;margin:0 0 0 28px;transition:height .2s var(--ease),margin .2s var(--ease)}
.rel[aria-current] .ticks{height:18px;margin-top:12px}
.ticks button{background:var(--rule);height:100%;transition:background .1s}
.ticks button:hover{background:var(--ink-3)}
.ticks button[aria-current]{background:var(--ink)}
.sum{margin:0 0 0 28px;max-height:0;overflow:hidden;font:400 15px/1.25 var(--serif);color:var(--ink-2);transition:max-height .2s var(--ease),margin .2s}
.rel[aria-current] .sum{max-height:80px;margin-top:10px}
.keys{display:flex;justify-content:space-between;color:var(--ink-3)}
.field{display:grid;grid-template-rows:1fr auto;min-width:0}
.stage{position:relative;margin:28px 32px 0;min-height:0;display:flex;align-items:center;justify-content:center}
.stage .c{position:absolute;color:var(--ink-3)}
.c.tl{top:0;left:0}.c.tr{top:0;right:0}.c.bl{bottom:0;left:0}.c.br{bottom:0;right:0}
.pic{position:relative;max-width:calc(100% - 96px);max-height:calc(100% - 64px);display:flex}
.pic img,.pic video{max-width:100%;max-height:calc(100svh - 230px);width:auto;height:auto;object-fit:contain}
.pic.in{animation:in .22s var(--ease)}
@keyframes in{from{opacity:.0;transform:translateY(6px)}}
.q{font:400 clamp(30px,4.4vw,70px)/1 var(--serif);max-width:12em;text-align:center}
.read{display:grid;grid-template-columns:48px minmax(0,1.1fr) minmax(0,1fr);gap:4px 20px;padding:18px 32px 24px;border-top:1px solid var(--rule);margin:18px 0 0;min-height:112px}
.read .n{font:600 12px/1.6 var(--sans);font-stretch:120%;color:var(--orange-ink)}
.read h2{margin:0;font:400 24px/1.1 var(--serif)}
.read .f{grid-column:2;color:var(--ink-2)}
.read p{grid-column:3;grid-row:1/span 2;margin:0;color:var(--ink-2);max-width:46ch}
@media(max-width:860px){
 body{height:auto;overflow:auto;display:block}
 .ctl{border:0;padding:18px 16px 0}.mark img{width:150px}.rels{margin-top:18px}.keys{display:none}
 .stage{margin:16px;height:56svh}.pic img,.pic video{max-height:52svh}
 .read{grid-template-columns:36px 1fr;padding:14px 16px 40px}.read p{grid-column:2;grid-row:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<aside class="ctl">
 <div><a class="mark" href="#"><img src="/media/brand/tangerine-script-480.webp" alt="Tangerine"></a><p class="decl">We build brands.</p></div>
 <ol class="rels" id="rels"></ol>
 <div class="keys sys"><span>← → work</span><span>↑ ↓ relationship</span><span>↵ open</span></div>
</aside>
<main class="field">
 <div class="stage" id="stage">
  <span class="c tl sys" id="ctl"></span><span class="c tr sys" id="ctr"></span><span class="c bl sys" id="cbl"></span><span class="c br sys" id="cbr"></span>
  <div class="pic" id="pic"></div>
 </div>
 <div class="read" id="read" aria-live="polite"><span class="n" id="rn"></span><h2 id="rt"></h2><span class="f sys" id="rf"></span><p id="rp"></p></div>
</main>
<script>
(async () => {
 const D = await (await fetch('/data/archive.json')).json();
 const A = D.artifacts, R = D.rels;
 let r = 0, i = 0;
 const by = R.map(x => A.filter(a => a.rel === x.slug));
 const rels = document.getElementById('rels');
 rels.innerHTML = R.map((x, k) => `<li class="rel" data-k="${k}"><button data-rel="${k}"><span class="sys o">${x.no}</span><span class="nm">${x.name}</span><span class="sys mute">${String(x.count).padStart(2,'0')}</span></button>
  <div class="ticks">${by[k].map((a, j) => `<button data-t="${j}" aria-label="${a.text}"></button>`).join('')}</div><p class="sum">${x.summary}</p></li>`).join('');
 const ratio = a => (a.w / a.h).toFixed(2) + ' : 1';
 function show() {
  const a = by[r][i];
  document.querySelectorAll('.rel').forEach((el, k) => k === r ? el.setAttribute('aria-current', 'true') : el.removeAttribute('aria-current'));
  document.querySelectorAll('.rel').forEach((el, k) => el.querySelectorAll('.ticks button').forEach((b, j) => (k === r && j === i) ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current')));
  const pic = document.getElementById('pic');
  pic.classList.remove('in'); void pic.offsetWidth;
  pic.innerHTML = a.kind === 'quote' ? `<div class="q">${a.quote}</div>` : a.kind === 'video'
   ? `<video src="${a.video}" poster="${a.src}" muted loop playsinline autoplay></video>`
   : `<img src="${a.src}" srcset="${a.srcset}" sizes="70vw" alt="${a.alt}">`;
  pic.classList.add('in');
  ctl.textContent = `${a.code} ${a.no}.${a.n}`; ctr.textContent = a.kind === 'quote' ? 'Text' : `${a.w} × ${a.h}`;
  cbl.textContent = a.chapter; cbr.textContent = a.kind === 'quote' ? '' : ratio(a);
  rn.textContent = a.n; rt.innerHTML = a.title; rf.textContent = [a.disc.join(', '), a.date, a.status].filter(Boolean).join(' · ');
  rp.innerHTML = a.note;
 }
 rels.addEventListener('click', e => {
  const t = e.target.closest('[data-t]'), b = e.target.closest('[data-rel]');
  if (t) { r = +t.closest('.rel').dataset.k; i = +t.dataset.t; show(); }
  else if (b) { if (+b.dataset.rel !== r) { r = +b.dataset.rel; i = 0; } show(); }
 });
 addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') i = Math.min(i + 1, by[r].length - 1);
  else if (e.key === 'ArrowLeft') i = Math.max(i - 1, 0);
  else if (e.key === 'ArrowDown') { r = (r + 1) % 4; i = 0; }
  else if (e.key === 'ArrowUp') { r = (r + 3) % 4; i = 0; }
  else if (/^[1-4]$/.test(e.key)) { r = +e.key - 1; i = 0; }
  else return;
  e.preventDefault(); show();
 });
 show();
})();
</script>
</body></html>
