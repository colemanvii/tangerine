<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Index 005 · Study B — Four lobes</title>
<link rel="stylesheet" href="base.css">
<style>
.page{height:100svh;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;padding:clamp(20px,3vw,44px) clamp(20px,3.4vw,52px);gap:0 clamp(24px,4vw,64px)}
.fruit{grid-row:1/3;min-height:0;position:relative}
.fruit svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.side{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.side .wm{font-size:clamp(34px,5.6vw,96px);writing-mode:vertical-rl;transform:rotate(180deg);align-self:end;letter-spacing:-.04em}
.side .top{display:grid;gap:6px;justify-items:end;text-align:right}
.side .grey{color:var(--grey)}
.bot{grid-column:2;display:flex;justify-content:space-between;gap:20px;color:var(--grey);padding-top:20px;justify-self:end}
.peel{fill:var(--orange)}
.lobe{fill:var(--orange);transition:fill .2s}
.lobe.study{fill:var(--white);stroke:var(--orange);stroke-width:2.2;vector-effect:non-scaling-stroke}
.nm{font-family:Archivo;font-stretch:125%;font-weight:760;font-size:39px;letter-spacing:-.03em;fill:#fff;pointer-events:none}
.nm.study{fill:var(--orange)}
.no{font:500 14px Archivo;fill:#fff;font-feature-settings:"tnum";letter-spacing:.04em;pointer-events:none}
.no.study{fill:var(--orange)}
a.seg:hover .lobe:not(.study),a.seg:focus-visible .lobe:not(.study){fill:var(--ink)}
a.seg:hover .lobe.study,a.seg:focus-visible .lobe.study{fill:var(--pith)}
a.seg:focus-visible{outline:none}a.seg:focus-visible .lobe{stroke:var(--ink);stroke-width:3}
@media (max-width:760px){
  .page{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:16px}
  .side{grid-row:1;flex-direction:row-reverse;align-items:start}
  .side .wm{writing-mode:horizontal-tb;transform:none;font-size:clamp(30px,10vw,54px);align-self:start}
  .fruit{grid-row:2}
  .bot{grid-column:1;justify-self:stretch;padding:0}
}
</style></head><body>
<div class="page">
<div class="fruit"><svg id="svg" viewBox="0 0 1000 1000" role="group" aria-label="Tangerine: four segments, four relationships"></svg></div>
<div class="side"><div class="top sys"><span>We build brands.</span><span class="grey">Four relationships,<br>one fruit.</span></div><a href="/" class="wm">Tangerine</a></div>
<div class="bot sys"><span>Ars longa, vita brevis.</span><a href="https://www.instagram.com/ex.tangerina/">Instagram</a></div>
</div>
<p class="study-tag">Study B · Four lobes</p>
<script type="module">
import { section } from '../../tools/citrus.mjs';
const work = [
  { n: '01', lines: ['Freeman'], href: '/freeman-general-contracting/', label: 'Freeman General Contracting' },
  { n: '02', lines: ['Joseph', 'Martin'], href: '/joseph-martin/', label: 'Joseph Martin' },
  { n: '03', lines: ['Kashus', 'Culpepper'], href: '/kashus-culpepper/', label: 'Kashus Culpepper' },
  { n: '04', lines: ['Scout', 'Motors'], href: '/scout-motors/', label: 'Scout Motors, independent study', study: true },
];
// Lobes start at the 10-o'clock membrane; Freeman takes the top-left.
const cuts = [-178, -86, 6, 92];
const s = section({ cuts, R: 490, rind: 40, gap: 18, hollow: 24, bow: 0.07, shoulder: 130, core: [-9, 7] });
const order = [0, 1, 2, 3];
let out = `<path class="peel" fill-rule="evenodd" d="M500 ${500 - s.R}a${s.R} ${s.R} 0 1 0 .01 0ZM500 ${500 - s.R + 15}a${s.R - 15} ${s.R - 15} 0 1 0 .01 0Z"/>`;
s.lobes.forEach((l, i) => {
  const w = work[order[i]], st = w.study ? ' study' : '';
  const [x, y] = l.anchor(s.Rs * 0.52);
  const lh = 40, y0 = y - ((w.lines.length - 1) * lh) / 2;
  out += `<a class="seg" href="${w.href}" aria-label="${w.n}, ${w.label}"><path class="lobe${st}" d="${l.d}"/>` +
    `<text class="no${st}" x="${x}" y="${y0 - 46}" text-anchor="middle">${w.n}</text>` +
    `<text class="nm${st}" text-anchor="middle">${w.lines.map((t, j) => `<tspan x="${x}" y="${y0 + j * lh + 13}">${t}</tspan>`).join('')}</text></a>`;
});
document.getElementById('svg').innerHTML = out;
</script>
</body></html>
