<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Tangerine — Recent work</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#242421;background:white;font:12px/1.55 Monaco,Menlo,Consolas,monospace}button,input,a{font:inherit;color:inherit}button{border:0;background:none;padding:7px 3px;cursor:pointer}button:hover,a:hover{text-decoration:underline;text-underline-offset:4px}:focus-visible{outline:1px solid #b54719;outline-offset:4px}main{min-height:100svh;display:grid;align-content:center;justify-items:center;padding:48px 22px 94px}figure{margin:0;text-align:center}#piece{display:block;width:fit-content;max-width:100%;margin:auto}img{display:block;width:auto;height:auto;max-width:min(71vw,660px);max-height:48svh;margin:auto}figcaption{margin:17px auto 0;max-width:90vw}#project{color:#686864}time{display:block;font-size:10px;color:#74746e;margin-top:3px}nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:white;white-space:nowrap}.brand{color:#b74016}.brand::before{content:'';display:inline-block;background:#f26b21;width:5px;height:5px;margin-right:7px;vertical-align:2px}.paging{display:flex;gap:6px;align-items:center;color:#62625d}.paging button{min-width:28px;font-size:16px}dialog{border:1px solid #cfcfca;background:white;color:inherit;padding:18px;width:min(92vw,470px);max-height:70svh}dialog::backdrop{background:rgb(255 255 255/.85)}.row{display:flex;gap:12px;align-items:center}input{flex:1;min-width:0;padding:8px 0;border:0;border-bottom:1px solid #aaa;border-radius:0}#matches button{display:block;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid #eee}small{color:#696964;display:block}#notice{color:#757570}@media(max-width:600px){img{max-width:88vw;max-height:52svh}nav{bottom:18px}main{padding-bottom:72px}}
</style></head><body><main><figure aria-live="polite"><a id="piece" aria-label="Open full image" target="_blank" rel="noopener"><img id="art" alt=""></a><figcaption><span id="title"></span><span id="project"></span><time></time></figcaption></figure><p id="notice" role="status">Loading recent work…</p></main>
<nav aria-label="Archive controls"><button class="brand" id="latest" title="Show latest work">Tangerine</button><button id="find" aria-haspopup="dialog">Retrieve</button><span class="paging"><button id="prev" aria-label="Previous piece">←</button><span id="count"></span><button id="next" aria-label="Next piece">→</button></span></nav>
<dialog><div class="row"><input type="search" aria-label="Search the archive" placeholder="Find a piece…" autocomplete="off"><button id="close" aria-label="Close search">Esc</button></div><div id="matches"></div></dialog><script src="screen.js" defer></script></body></html>
