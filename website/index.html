<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fdfefd">
<title>Tangerine — Selected Work</title>
<meta name="description" content="Tangerine. An independent creative practice. Selected work.">
<link rel="canonical" href="https://ex-tangerina.com/">
<meta property="og:title" content="Tangerine — Selected Work">
<meta property="og:description" content="An independent creative practice.">
<meta property="og:image" content="https://ex-tangerina.com/media/brand/og.jpg">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
@font-face{font-family:Instrument;src:url('/fonts/instrument-serif-regular.woff2') format('woff2');font-display:swap}
:root{color-scheme:light;--white:#fdfefd;--ink:#41484b;--accent:#b8512d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--white)}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:1px solid var(--accent);outline-offset:6px}
.page{height:100svh;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(24px,4.5vw,64px)}
.logo{display:inline-block;width:max-content}
.logo{font:500 clamp(19px,1.65vw,24px)/1.1 Arial,Helvetica,sans-serif;letter-spacing:-.055em;color:#343a3c}.logo .period{color:var(--accent)}
main{display:flex;align-items:center;min-height:0}
.index{display:flex;flex-direction:column;gap:clamp(15px,2.6vh,25px);margin-left:clamp(0px,12vw,190px)}
.index a{display:block;width:max-content;max-width:100%;font:clamp(27px,2.8vw,43px)/1.07 Instrument,Georgia,serif;letter-spacing:-.025em;transition:color .15s ease}
.index a:hover{color:var(--accent)}
footer{display:flex;justify-content:flex-end}
footer a{font:11px/1.4 Arial,Helvetica,sans-serif;color:#969da0;letter-spacing:.01em}
footer a:hover{color:var(--accent)}
@media(max-width:650px){.page{padding:26px 25px 23px}.logo{font-size:21px}.index{margin-left:0;gap:clamp(15px,2.6vh,22px)}.index a{font-size:clamp(27px,7vw,34px)}}
@media(max-height:480px){.page{padding-top:14px;padding-bottom:12px}.logo{font-size:18px}.index{gap:8px}.index a{font-size:clamp(22px,5vh,30px)}}
@media(prefers-reduced-motion:reduce){.index a{transition:none}}
</style>
</head>
<body>
<div class="page">
<header><a class="logo" href="/" aria-label="Tangerine home">tangerine<span class="period">.</span></a></header>
<main><nav class="index" aria-label="Selected work">
<a href="/freeman-general-contracting/">Freeman</a>
<a href="/joseph-martin/">Joseph Martin</a>
<a href="/kashus-culpepper/">Kashus Culpepper</a>
<a href="/scout-motors/">Scout Motors</a>
</nav></main>
<footer><a href="https://www.instagram.com/ex.tangerina/" target="_blank" rel="noopener noreferrer">Instagram</a></footer>
</div>
</body>
</html>
