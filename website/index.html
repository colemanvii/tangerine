<style>
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
:root{--paper:#f3ead7;--ink:#2a2118;--tangerine:#ec641d;--quiet:#6d6253;--gutter:clamp(20px,3.6vw,56px);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;--label:600 10.5px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* One trimmed sheet: the fruit bleeds off the edge and is cropped, never scrolled to. */
.sheet{position:fixed;inset:0;overflow:hidden}
::selection{background:var(--tangerine);color:var(--paper)}

.fruit{position:absolute;z-index:0;width:min(76vw,122svh);right:-11vw;bottom:-25svh;height:auto;pointer-events:none}

.label{position:absolute;z-index:1;margin:0;font:var(--label);letter-spacing:.2em;text-transform:uppercase}
.foot{bottom:calc(var(--gutter) + env(safe-area-inset-bottom));left:var(--gutter);display:flex;gap:clamp(22px,3vw,44px);align-items:center}
.foot a{color:var(--quiet);text-decoration:none}
.foot a:hover{color:var(--tangerine)}
.foot a:focus-visible{outline:1px solid var(--tangerine);outline-offset:6px}

.title{position:absolute;z-index:1;left:var(--gutter);bottom:calc(var(--gutter) + 14svh);margin:0}
h1{margin:0 0 0 -.04em;font:400 clamp(86px,14vw,260px)/.78 var(--serif);letter-spacing:-.045em;white-space:nowrap}
h1 svg{display:inline-block;width:.19em;height:.19em;margin-left:.03em;vertical-align:baseline;overflow:visible}
.grow{margin:.56em 0 0;font:italic 400 clamp(30px,3.9vw,68px)/1 var(--serif);letter-spacing:-.01em}

@media (max-aspect-ratio:1/1){
  .fruit{width:min(128vw,72svh);right:-26vw;bottom:auto;top:-11svh}
  .title{bottom:calc(var(--gutter) + 9svh)}
  h1{font-size:clamp(86px,25vw,250px)}
  .grow{font-size:clamp(30px,8.6vw,72px)}
}
</style>
</head>
