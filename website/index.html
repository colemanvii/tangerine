<script>
/* COLOR FIELD V2 — THE RULES
   1. Colour is light. Every field emits; some burn, most glow, a few only breathe.
   2. Three moods: joyful (high key, saturated, complementary), mysterious (rich
      chromatic black, deep colour, one ember), spiritual (pale, close values, one line of light).
   3. Eight ways to stand: veil, stack, nest, horizon, aperture, eclipse, diptych, drift.
   4. Every field has its own depth. Some are in focus, some are not; focus drifts,
      and comes toward you where you look.
   5. Tangerine is always there: the whole field, an ember, or a line on the horizon.
   6. One work a day, numbered from No. 001. The first twelve were released together. */
(function () {
  'use strict';
  const T = Tangerine, canvas = document.getElementById('field'), label = document.getElementById('label');
  const params = new URLSearchParams(location.search);
  if (location.hash === '#work') history.replaceState(null, '', location.pathname + location.search);

  /* ----- The box of colour, by mood ----- */
  const BOX = {
    joyful: {
      grounds: { cream: '#f1e6d4', blush: '#f5d0c8', bone: '#ece4d6', sky: '#cfe2ea' },
      colours: { tangerine: '#f6661c', vermilion: '#e8381e', rose: '#e8487c', pink: '#f4a6b6', marigold: '#f4a723', lemon: '#f3d54a',
                 turquoise: '#1aa3b0', cobalt: '#2c4cd0', violet: '#6a3cc8', green: '#2f9e5e' },
      tangerine: ['tangerine', 'vermilion', 'marigold'], exposure: 1.15, light: { main: 0.3, second: 0.25, light: 1.0 }, dark: false
    },
    mysterious: {
      grounds: { 'blue-black': '#03050c', 'green-black': '#020805', 'red-black': '#0c0304', 'violet-black': '#07040e' },
      colours: { ultramarine: '#18239a', crimson: '#7a0618', emerald: '#014d3c', violet: '#33167a', ember: '#ff5a10',
                 oxblood: '#3e0612', teal: '#04414a', gold: '#d18c1a' },
      tangerine: ['ember'], exposure: 1.3, light: { main: 0.22, second: 0.12, light: 1.6 }, dark: true
    },
    spiritual: {
      grounds: { pearl: '#e7e3dc', 'pale gold': '#ebdfc4', lilac: '#e0dae8', mist: '#d9e1e4', dawn: '#ecdad2' },
      colours: { 'white light': '#fff2d6', 'pale gold': '#f7cf7e', 'rose light': '#f4bdb3', 'sky light': '#bcd6ee', apricot: '#f9b27a',
                 lilac: '#cdbcf0', tangerine: '#ff7a2e' },
      tangerine: ['apricot', 'tangerine'], exposure: 1.0, light: { main: 0.34, second: 0.26, light: 1.9 }, dark: false
    }
  };
  const MOODS = ['joyful', 'mysterious', 'spiritual'];
  const FORMS = ['veil', 'eclipse', 'stack', 'aperture', 'diptych', 'horizon', 'nest', 'drift'];

  /* ----- One work, from its number ----- */
  function work(n) {
    const r = T.rng(n * 7919 + 271), pick = a => a[Math.floor(r() * a.length)], between = (a, b) => a + (b - a) * r();
    const mood = MOODS[(n - 1) % 3];
    // three moods against eight forms: no pairing repeats for twenty-four days
    const form = FORMS[(n - 1) % 8];
    const box = BOX[mood];
    const groundName = pick(Object.keys(box.grounds));
    const names = Object.keys(box.colours);
    const used = [];
    const choose = (pool) => { const p = pool.filter(c => !used.includes(c)); const c = pick(p.length ? p : pool); used.push(c); return c; };

    // roles: main, second, light (the brightest), halo (light, scattered), occluder (in front, dark)
    const ROLES = {
      veil: ['main', 'light', 'second'], stack: ['main', 'light', 'second'], nest: ['main', 'second', 'light'],
      horizon: ['main', 'second', 'light'], aperture: ['halo', 'light'], eclipse: ['halo', 'light', 'occluder'],
      diptych: ['main', 'second', 'light'], drift: ['main', 'second', 'light']
    }[form];
    const lightName = mood === 'joyful' ? null : choose(mood === 'mysterious' ? ['ember', 'gold', 'ember', 'crimson', 'ultramarine'] : ['pale gold', 'tangerine', 'apricot', 'rose light']);
    const colourOf = {};
    if (lightName) colourOf.light = lightName;
    colourOf.main = mood === 'joyful' && r() < 0.5 ? (used.push('tangerine'), 'tangerine') : choose(mood === 'mysterious' ? ['crimson', 'ultramarine', 'emerald', 'violet', 'oxblood', 'teal'] : mood === 'spiritual' ? ['sky light', 'lilac', 'rose light', 'pale gold', 'apricot'] : names);
    colourOf.second = choose(mood === 'mysterious' ? ['oxblood', 'violet', 'teal', 'ultramarine', 'emerald', 'crimson'] : mood === 'spiritual' ? ['sky light', 'lilac', 'rose light', 'white light', 'pale gold'] : names);
    if (!colourOf.light) colourOf.light = choose(['turquoise', 'cobalt', 'violet', 'lemon', 'rose', 'green', 'tangerine']);
    // rule 5: tangerine is always somewhere
    if (!Object.values(colourOf).some(c => box.tangerine.includes(c))) {
      const role = ROLES.includes('light') && mood !== 'joyful' ? 'light' : 'second';
      colourOf[role] = box.tangerine[Math.floor(r() * box.tangerine.length)];
    }
    // on a pale ground an opening must be deep to be seen
    if ((form === 'aperture' || form === 'eclipse') && !box.dark) {
      colourOf.light = pick(mood === 'joyful' ? ['cobalt', 'violet', 'vermilion', 'tangerine', 'green', 'rose'] : ['tangerine', 'apricot', 'pale gold']);
    }
    colourOf.halo = colourOf.light;

    const F = (role, shape, geo, focus, extra = {}) => {
      const colourName = role === 'occluder' ? null : colourOf[role];
      const hex = role === 'occluder' ? (mood === 'mysterious' ? box.grounds[groundName] : box.colours[colourOf.main]) : box.colours[colourName];
      const light = role === 'occluder' ? (mood === 'mysterious' ? 0 : box.light.main) : role === 'halo' ? box.light.light * 0.55 : box.light[role];
      return Object.assign({ role, shape, geo, focus: Math.min(1, Math.max(0, focus + (mood === 'spiritual' ? 0.1 : 0))), hex, name: colourName, light,
        opacity: role === 'halo' ? 0.42 : 1, rough: 1 }, extra);
    };
    const f = between, fields = [];
    switch (form) {
      case 'veil':
        fields.push(F('main', 'box', [0.03, 0.02, 0.97, 0.97], f(0.1, 0.3)));
        fields.push(F('light', 'box', [f(0.12, 0.2), f(0.12, 0.2), f(0.8, 0.88), f(0.6, 0.72)], f(0.5, 0.75)));
        fields.push(F('second', 'box', [0.03, f(0.82, 0.86), 0.97, 0.97], f(0.05, 0.25)));
        break;
      case 'stack': {
        const a = f(0.36, 0.5), b = a + f(0.05, 0.12);
        fields.push(F('main', 'box', [0.02, 0, 0.98, a], f(0, 0.3)));
        fields.push(F('light', 'box', [0.06, a + 0.04, 0.94, b], f(0.15, 0.45)));
        fields.push(F('second', 'box', [0.02, b + 0.05, 0.98, 1], f(0, 0.3)));
        break;
      }
      case 'nest':
        fields.push(F('main', 'sq', [1, 0], f(0, 0.25)));
        fields.push(F('second', 'sq', [0.7, 0.08], f(0.2, 0.5)));
        fields.push(F('light', 'sq', [0.42, 0.16], f(0, 0.35)));
        break;
      case 'horizon': {
        const y = f(0.5, 0.66);
        fields.push(F('main', 'box', [-0.3, -0.5, 1.3, y - 0.02], f(0.05, 0.3)));
        fields.push(F('second', 'box', [-0.3, y + 0.02, 1.3, 1.5], f(0.05, 0.3)));
        fields.push(F('light', 'box', [-0.3, y - 0.012, 1.3, y + 0.012], f(0.15, 0.35)));
        break;
      }
      case 'aperture': {
        const w = f(0.28, 0.4), h = w * f(1.1, 1.45), cx = f(0.42, 0.58), cy = f(0.42, 0.5);
        fields.push(F('halo', 'ap', [cx, cy, w * 1.6, h * 1.4], 1));
        fields.push(F('light', 'ap', [cx, cy, w / 2, h / 2], 0, { rough: 0.25 }));
        break;
      }
      case 'eclipse': {
        const rr = f(0.28, 0.36), cx = f(0.4, 0.6), cy = f(0.4, 0.52), dx = f(0.06, 0.12) * (r() < 0.5 ? -1 : 1), dy = f(-0.08, 0.02);
        fields.push(F('halo', 'disc', [cx, cy, rr * 2.1], 1));
        fields.push(F('light', 'disc', [cx, cy, rr], f(0.25, 0.6)));
        fields.push(F('occluder', 'disc', [cx + dx, cy + dy, rr * f(0.92, 1.0)], f(0, 0.12), { rough: 0.4 }));
        break;
      }
      case 'diptych': {
        const g = f(0.012, 0.03);
        fields.push(F('main', 'box', [0.02, 0.02, 0.5 - g, 0.98], f(0, 0.3)));
        fields.push(F('second', 'box', [0.5 + g, 0.02, 0.98, 0.98], f(0, 0.3)));
        fields.push(F('light', 'box', [0.5 - g * 0.3, -0.2, 0.5 + g * 0.3, 1.2], f(0.05, 0.3), { rough: 0.3 }));
        break;
      }
      case 'drift':
        fields.push(F('main', 'box', [-0.15, -0.15, f(0.6, 0.75), f(0.8, 0.95)], 1));
        fields.push(F('second', 'box', [f(0.3, 0.42), f(0.15, 0.25), f(0.88, 0.98), f(0.62, 0.75)], f(0.25, 0.4)));
        fields.push(F('light', 'box', [f(0.58, 0.66), f(0.6, 0.66), f(0.74, 0.84), f(0.76, 0.86)], 0));
        break;
    }
    fields.forEach(x => {
      x.rack = r() < 0.6 ? between(0.1, 0.28) : 0; x.rackP = between(45, 110); x.ph = r() * 6.28;
      x.breathe = between(0.06, 0.14); x.breatheP = between(30, 80);
      x.edges = [0, 1, 2, 3].map(() => ({ p: between(70, 160), ph: r() * 6.28 }));
    });
    // a title in the manner of a wall label
    const named = [...new Set(fields.filter(x => x.name).map(x => x.name))];
    const list = named.length > 2 ? named.slice(0, -1).join(', ') + ' and ' + named[named.length - 1] : named.join(' and ');
    const title = list.charAt(0).toUpperCase() + list.slice(1) + ' on ' + groundName;
    return { n, mood, form, ground: box.grounds[groundName], dark: box.dark, exposure: box.exposure, fields, title };
  }

  /* ----- Layout: the frame the work stands in ----- */
  let W = 0, H = 0, frame = null;
  function layout() {
    const portrait = H > W * 1.05;
    const mx = Math.round(Math.max(20, Math.min(W * 0.058, 92)));
    const wm = Math.round(Math.max(150, Math.min(W * (portrait ? 0.44 : 0.165), 290)));
    const sig = Math.max(wm * 0.165, 30), mb = Math.round(mx * (portrait ? 1.0 : 0.9));
    const top = Math.round(mx * (portrait ? 1.25 : 1)) + 22;
    frame = { x0: mx, y0: top, x1: W - mx, y1: H - mb - sig - Math.round(mx * (portrait ? 1.0 : 0.85)) };
    const s = document.documentElement.style;
    s.setProperty('--mx', mx + 'px'); s.setProperty('--mb', mb + 'px'); s.setProperty('--wm', wm + 'px');
  }
  // geometry in shader space: x in [0, W/H], y up in [0, 1]
  function place(fd, t) {
    const fw = frame.x1 - frame.x0, fh = frame.y1 - frame.y0, m = Math.min(fw, fh);
    const amp = Math.min(W, H) * 0.01, e = fd.edges.map(x => Math.sin(t * 6.283 / x.p + x.ph) * amp);
    const X = px => px / H, Y = py => 1 - py / H;
    let cx, cy, hx, hy, shape = 0;
    if (fd.shape === 'box') {
      const [a, b, c, d] = fd.geo;
      const x0 = frame.x0 + a * fw + e[0], x1 = frame.x0 + c * fw + e[2], y0 = frame.y0 + b * fh + e[1], y1 = frame.y0 + d * fh + e[3];
      cx = X((x0 + x1) / 2); cy = Y((y0 + y1) / 2); hx = (x1 - x0) / 2 / H; hy = (y1 - y0) / 2 / H;
    } else if (fd.shape === 'sq') {
      const [k, lift] = fd.geo, side = m;
      const bx = frame.x0 + fw / 2, by = frame.y0 + fh / 2 + side / 2;
      cx = X(bx); cy = Y(by - side * lift - side * k / 2); hx = hy = side * k / 2 / H + e[0] / H * 0.5;
    } else if (fd.shape === 'ap') {
      const [x, y, w, h] = fd.geo;
      cx = X(frame.x0 + x * fw); cy = Y(frame.y0 + y * fh); hx = w * m / H + e[0] / H * 0.4; hy = h * m / H + e[1] / H * 0.4;
    } else {
      const [x, y, rr] = fd.geo;
      cx = X(frame.x0 + x * fw + e[0]); cy = Y(frame.y0 + y * fh + e[1]); hx = hy = rr * m / H; shape = 1;
    }
    return { cx, cy, hx, hy, shape };
  }

  /* ----- Rendering ----- */
  const gl = T.gl(canvas);

  const LIGHT = T.glslNoise + `
uniform vec2 uRes; uniform float uTime, uSeed;
uniform vec3 uGround; uniform float uDark, uExposure;
uniform vec4 uGeo[4]; uniform float uShape[4]; uniform vec3 uCol[4]; uniform vec4 uPar[4];
varying vec2 vUv;
float boxSD(vec2 q,vec2 h){vec2 d=abs(q)-h;return length(max(d,0.))+min(max(d.x,d.y),0.);}
vec3 aces(vec3 x){return clamp(x*(2.51*x+.03)/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
  float asp=uRes.x/uRes.y, t=uTime;
  vec2 p=vec2(vUv.x*asp,vUv.y);
  p+=(vec2(fbm3(p*1.2+uSeed+t*.005),fbm3(p*1.2-uSeed-t*.004))-.5)*.016;
  // the ground: a chromatic dark that is never flat, or a pale that holds light
  float gt=fbm(p*2.4+uSeed*.3);
  vec2 c0=p-vec2(asp*.5,.55);
  vec3 col=uGround*(.92+.14*gt)*mix(1.-.18*dot(c0,c0),1.+.5*exp(-dot(c0,c0)*3.),uDark);
  for(int i=0;i<4;i++){
    vec4 par=uPar[i];
    if(par.z<=0.) continue;
    float k=float(i)*3.17+uSeed;
    vec2 q=p-uGeo[i].xy;
    float d=uShape[i]<.5?boxSD(q,uGeo[i].zw):length(q)-uGeo[i].z;
    float blur=par.x, rough=par.y;
    if(rough>.01&&d<.12){
      d+=(vnoise(p*1.7+k+vec2(t*.009,-t*.007))-.5)*.03*rough;
      d+=(fbm3(p*7.5+k*2.1+t*.004)-.5)*.018*rough;
      d+=(fbm3(vec2(p.x*1.6,p.y*19.)+k*5.3)-.5)*.012*rough;
    }
    float m=1.-smoothstep(-blur,blur*.9,d);
    vec3 c=uCol[i];
    // inside: a cloud of density, and a hotter core where the field is deepest
    float cloud=fbm3(p*2.+k*7.3+t*.006);
    c*=mix(.84,1.14,cloud*(.3+.7*rough));
    float size=max(uGeo[i].z,uShape[i]<.5?uGeo[i].w:uGeo[i].z);
    float core=clamp(-d/(size+.001),0.,1.);
    c*=1.+par.w*.35*core*core*smoothstep(.01,.08,blur);
    col=mix(col,c,m*par.z);
    col+=c*par.w*.14*exp(-max(d,0.)/(.05+blur))*par.z;
  }
  // film: exposure, a filmic shoulder that lets bright colour burn toward white, a soft vignette
  col=aces(col*uExposure);
  vec2 v=vUv-.5; col*=1.-.24*dot(v,v)*mix(.6,1.5,uDark);
  col=toSrgb(col)+(h21(gl_FragCoord.xy+uSeed)-.5)/255.;
  gl_FragColor=vec4(col,1.);
}`;

  const LENS = T.glslNoise + T.glslGrain + `
uniform sampler2D uTex; uniform vec2 uRes; uniform float uSeed, uDark;
varying vec2 vUv;
void main(){
  vec2 uv=vUv, dir=uv-.5;
  // the lens: a little colour separation toward the corners
  float ca=.004*dot(dir,dir)*4.;
  vec3 c=vec3(texture2D(uTex,uv-dir*ca).r,texture2D(uTex,uv).g,texture2D(uTex,uv+dir*ca).b);
  c=applyGrain(c,gl_FragCoord.xy,uSeed,mix(.065,.08,uDark));
  gl_FragColor=vec4(c,1.);
}`;

  let light = null, lens = null, target = null, lowW = 0, lowH = 0, dpr = 1, loop = null;
  if (gl) { light = T.program(gl, LIGHT); lens = T.program(gl, LENS); }

  const today = T.edition();
  const last = Math.max(today, 12);
  let no = params.has('no') ? Math.min(last, Math.max(1, parseInt(params.get('no'), 10) || 1)) : today;
  const variantCount = document.getElementById('variant-count');
  let current = null, presence = 0;

  function hang(n) {
    no = n; current = work(n);
    current.fields.forEach(x => { x.lin = T.hexToLin(x.hex); x.pull = 0; });
    const s = document.documentElement.style;
    s.setProperty('--ground', current.ground);
    s.setProperty('--text', current.dark ? '#efe6d8' : '#1d1a16');
    document.querySelector('meta[name=theme-color]').content = current.ground;
    label.textContent = 'No. ' + T.pad3(n) + ' · ' + current.title;
    variantCount.textContent = T.pad3(n) + ' / ' + T.pad3(last);
  }

  const geo = new Float32Array(16), shp = new Float32Array(4), col = new Float32Array(12), par = new Float32Array(16);
  function render(t, dt = 0) {
    if (!gl || !frame) return;
    const P = T.pointer, px = P.sx * W / H, py = 1 - P.sy;
    geo.fill(0); shp.fill(0); col.fill(0); par.fill(0);
    current.fields.forEach((fd, i) => {
      const g = place(fd, t);
      geo.set([g.cx, g.cy, g.hx, g.hy], i * 4); shp[i] = g.shape;
      // the eye pulls the field it rests on toward focus
      const qx = Math.abs(px - g.cx) - g.hx, qy = Math.abs(py - g.cy) - g.hy;
      const dist = g.shape ? Math.hypot(px - g.cx, py - g.cy) - g.hx : Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0);
      const want = T.reduced() ? 0 : presence * 0.45 * Math.exp(-Math.max(dist, 0) * 5);
      fd.pull += (want - fd.pull) * (dt ? 1 - Math.exp(-dt / 1.4) : 1);
      const focus = Math.min(1, Math.max(0, fd.focus + fd.rack * Math.sin(t * 6.283 / fd.rackP + fd.ph) - fd.pull));
      const blur = 0.004 + 0.17 * Math.pow(focus, 1.7);
      const lum = fd.light * (1 + fd.breathe * Math.sin(t * 6.283 / fd.breatheP + fd.ph));
      const k = 0.72 + 1.5 * lum;
      col.set(fd.lin.map(v => v * k), i * 3);
      par.set([blur, fd.rough * Math.max(0, 1 - focus * 2.2), fd.opacity, lum], i * 4);
    });
    gl.useProgram(light);
    gl.uniform2f(light.u('uRes'), lowW, lowH);
    gl.uniform1f(light.u('uTime'), t);
    gl.uniform1f(light.u('uSeed'), (no * 7.919) % 40);
    gl.uniform3fv(light.u('uGround'), T.hexToLin(current.ground).map(v => v * (current.mood === 'spiritual' ? 0.78 : 1)));
    gl.uniform1f(light.u('uDark'), current.dark ? 1 : 0);
    gl.uniform1f(light.u('uExposure'), current.exposure);
    gl.uniform4fv(light.u('uGeo'), geo);
    gl.uniform1fv(light.u('uShape'), shp);
    gl.uniform3fv(light.u('uCol'), col);
    gl.uniform4fv(light.u('uPar'), par);
    T.draw(gl, light, target, lowW, lowH);
    gl.useProgram(lens);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, target.tex);
    gl.uniform1i(lens.u('uTex'), 0);
    gl.uniform2f(lens.u('uRes'), canvas.width, canvas.height);
    gl.uniform1f(lens.u('uSeed'), (no % 97) + 0.5);
    gl.uniform1f(lens.u('uDark'), current.dark ? 1 : 0);
    T.draw(gl, lens, null, canvas.width, canvas.height);
  }

  hang(no);
  T.onResize((w, h, d) => {
    W = w; H = h; dpr = d; layout();
    if (!gl) return;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const s = Math.min(1, 960 / Math.max(W, H));
    lowW = Math.round(W * s); lowH = Math.round(H * s);
    target = T.target(gl, lowW, lowH, target);
    if (loop) render(loop.time);
  });

  const startAt = T.hash(no + 5) * 900 + (Date.now() / 1000) % 600;
  loop = T.loop((t, dt) => {
    T.pointer.step(dt, 1.2);
    const want = T.pointer.inside ? 1 : 0;
    presence += (want - presence) * (1 - Math.exp(-dt / 1.5));
    render(t, dt);
  }, { offset: startAt, maxFps: 30 });
  function setMotion() { if (T.reduced()) { loop.stop(); render(loop.time); } else loop.start(); }
  T.onMotionChange(setMotion);
  setMotion();
  render(loop.time);
  document.body.classList.add('is-ready');

  /* ← → or a swipe: the collection. The first twelve are all hung; then one a day. */
  let turning = false;
  function turn(n) {
    n = ((n - 1 + last) % last) + 1;
    if (n === no || turning) return;
    const url = new URL(location.href);
    url.searchParams.set('no', String(n));
    history.replaceState(null, '', url);
    if (T.reduced()) { hang(n); render(loop.time); return; }
    turning = true; document.body.classList.add('is-turning');
    setTimeout(() => { hang(n); render(loop.time); document.body.classList.remove('is-turning'); turning = false; }, 520);
  }
  document.getElementById('prev-variant').addEventListener('click', () => turn(no - 1));
  document.getElementById('next-variant').addEventListener('click', () => turn(no + 1));
  addEventListener('keydown', e => {
    if (e.altKey || e.metaKey || e.ctrlKey) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); turn(no - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); turn(no + 1); }
  });
  let sx = null, sy = null;
  addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' && !e.target.closest('a,button')) { sx = e.clientX; sy = e.clientY; } });
  addEventListener('pointercancel', () => { sx = null; });
  addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(no + (dx < 0 ? 1 : -1));
  });
})();
</script>
</body>
</html>
