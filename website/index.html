<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f5ed">
<title>Tangerine — Independent creative practice</title>
<meta name="description" content="Tangerine is an independent creative practice. Selected work with Freeman, Joseph Martin, Kashus Culpepper, and independent studies.">
<link rel="canonical" href="https://ex-tangerina.com/">
<meta property="og:title" content="Tangerine — Independent creative practice">
<meta property="og:description" content="An index of selected work.">
<meta property="og:image" content="https://ex-tangerina.com/media/brand/og.jpg">
<link rel="icon" href="/favicon.png" sizes="64x64" type="image/png">
<link rel="preload" as="image" href="/media/freeman-general-contracting/home-freeman-1280.webp">
<link rel="preload" as="image" href="/media/brand/tangerine-script-480.webp">
<style>
@font-face{font-family:Instrument;src:url('/fonts/instrument-serif-regular.woff2') format('woff2');font-display:swap}
:root{--paper:#f8f5ed;--ink:#272621;--muted:#8c897f;--rule:#d9d5c9;--orange:#bf3d00}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:5px}.site{min-height:100svh;display:flex;flex-direction:column;padding:0 clamp(20px,3.3vw,60px)}.top{height:112px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule)}.mark img{display:block;width:clamp(150px,17vw,220px);height:auto}.top-right{display:flex;align-items:center;gap:36px}.tag,.fine,.index-no,.footer,.image-meta{font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.035em}.tag{color:var(--muted)}.top-right a{font-size:12px;border-bottom:1px solid var(--ink);padding-bottom:3px}.top-right a:hover{color:var(--orange);border-color:var(--orange)}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(290px,.78fr) minmax(0,1.22fr);gap:clamp(38px,7vw,130px);align-items:center;padding:clamp(32px,5vh,65px) 0}.left{display:flex;flex-direction:column;justify-content:center;align-self:stretch;max-width:600px}.intro{font:clamp(17px,1.7vw,23px)/1.2 Instrument,Georgia,serif;font-style:italic;margin:0 0 clamp(45px,9vh,110px);letter-spacing:-.015em}.intro span{color:var(--muted)}.index-title{margin:0 0 17px;color:var(--muted)}.items{border-top:1px solid var(--rule)}.item{display:grid;grid-template-columns:34px minmax(0,1fr) 15px;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left;cursor:pointer;padding:clamp(18px,2.5vh,27px) 0;color:var(--ink)}.item .name{font:clamp(27px,3.1vw,48px)/1.03 Instrument,Georgia,serif;letter-spacing:-.025em;transition:transform .22s ease,color .22s ease}.item .index-no{color:var(--muted)}.item .indicator{font-size:17px;opacity:0;color:var(--orange);transform:translateX(-5px);transition:opacity .18s,transform .18s}.item:hover .name,.item[aria-pressed=true] .name{color:var(--orange)}.item[aria-pressed=true] .indicator{opacity:1;transform:translateX(0)}.item:hover .indicator{opacity:.65}.left-bottom{margin-top:clamp(30px,7vh,75px);display:flex;gap:14px;align-items:baseline}.left-bottom .fine{color:var(--muted)}.left-bottom .current{font:15px/1.3 Instrument,Georgia,serif;font-style:italic}
.right{min-width:0;display:flex;flex-direction:column;justify-content:center}.plate{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1.28;max-height:min(67vh,780px);background:#eae6db;overflow:hidden}.plate img{display:block;width:100%;height:100%;object-fit:contain;transition:opacity .16s ease}.plate img.changing{opacity:.3}.plate-link{display:block}.plate-link:focus-visible{outline-offset:3px}.under{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin-top:15px}.under .caption{font:clamp(15px,1.35vw,20px)/1.25 Instrument,Georgia,serif}.under .image-meta{color:var(--muted);text-align:right}.bottom{display:flex;justify-content:space-between;gap:20px;align-items:center;border-top:1px solid var(--rule);min-height:68px;color:var(--muted)}.bottom a{color:var(--ink);font-size:12px}.bottom a:hover{color:var(--orange)}.bottom .footer{font-size:10px}
@media(max-width:850px){.top{height:85px}.stage{grid-template-columns:1fr;gap:34px;align-items:start;padding:28px 0 55px}.left{max-width:none}.intro{margin:0 0 37px}.item{padding:18px 0}.item .name{font-size:clamp(28px,6vw,43px)}.left-bottom{margin-top:26px}.right{max-width:850px}.plate{max-height:none;aspect-ratio:1.3}.bottom{padding:20px 0;min-height:65px}}@media(max-width:480px){.top-right .tag{display:none}.top-right{gap:0}.mark img{width:158px}.intro{font-size:19px}.item .name{font-size:32px}.plate{aspect-ratio:1.08}.under{gap:12px}.under .caption{font-size:17px}.under .image-meta{font-size:9px}.bottom{align-items:flex-start;flex-direction:column;gap:9px}.left-bottom .fine{font-size:9px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div class="site">
<header class="top">
<a class="mark" href="/" aria-label="Tangerine, home"><img src="/media/brand/tangerine-script-480.webp" width="480" height="200" alt="Tangerine"></a>
<div class="top-right"><span class="tag">Independent creative practice</span><a href="https://www.instagram.com/ex.tangerina/" target="_blank" rel="noopener noreferrer">Instagram ↗</a></div>
</header>
<main class="stage" id="main">
<section class="left" aria-label="Selected work">
<p class="intro">We build brands<span>.</span></p>
<h1 class="index-title fine">Selected work / Index</h1>
<div class="items" role="group" aria-label="Choose a relationship">
<button class="item" type="button" data-i="0" aria-pressed="true"><span class="index-no">01</span><span class="name">Freeman</span><span class="indicator" aria-hidden="true">↗</span></button>
<button class="item" type="button" data-i="1" aria-pressed="false"><span class="index-no">02</span><span class="name">Joseph Martin</span><span class="indicator" aria-hidden="true">↗</span></button>
<button class="item" type="button" data-i="2" aria-pressed="false"><span class="index-no">03</span><span class="name">Kashus Culpepper</span><span class="indicator" aria-hidden="true">↗</span></button>
<button class="item" type="button" data-i="3" aria-pressed="false"><span class="index-no">04</span><span class="name">Scout Motors</span><span class="indicator" aria-hidden="true">↗</span></button>
</div>
<div class="left-bottom"><span class="fine">Currently viewing</span><span class="current" id="current">Freeman General Contracting</span></div>
</section>
<section class="right" aria-label="Selected project preview">
<a class="plate-link" id="project-link" href="/freeman-general-contracting/" aria-label="Explore Freeman work"><div class="plate"><img id="art" src="/media/freeman-general-contracting/home-freeman-1280.webp" width="1280" height="800" alt="Freeman website design: signature on a warm background" fetchpriority="high"></div></a>
<div class="under"><span class="caption" id="caption">An evolving identity for a builder.</span><span class="image-meta" id="meta">Digital / Identity / Ongoing</span></div>
</section>
</main>
<footer class="bottom"><span class="footer">Tangerine © 2026 · An independent practice</span><a id="explore" href="/freeman-general-contracting/">Explore selected work ↗</a></footer>
</div>
<script>
(()=>{
const work=[
{title:'Freeman General Contracting',src:'/media/freeman-general-contracting/home-freeman-1280.webp',alt:'Freeman website design: signature on a warm background',caption:'An evolving identity for a builder.',meta:'Digital / Identity / Ongoing',href:'/freeman-general-contracting/'},
{title:'Joseph Martin',src:'/media/joseph-martin/cowboy-george-640.webp',alt:'Original cowboy illustration developed for Joseph Martin',caption:'Work, character, and the handmade.',meta:'Illustration / Design',href:'/joseph-martin/'},
{title:'Kashus Culpepper',src:'/media/kashus-culpepper/lil-kc-640.webp',alt:'Lil KC original illustrated character study',caption:'A character with a world of his own.',meta:'Illustration / Character',href:'/kashus-culpepper/'},
{title:'Scout Motors',src:'/media/scout-motors/scout-painting-640.webp',alt:'Independent Scout Motors-inspired painting study',caption:'An independent study in American design.',meta:'Independent study',href:'/scout-motors/'}
];
const buttons=[...document.querySelectorAll('.item')],img=document.getElementById('art'),link=document.getElementById('project-link'),caption=document.getElementById('caption'),meta=document.getElementById('meta'),current=document.getElementById('current'),explore=document.getElementById('explore');
let active=0;
function choose(i){if(i===active)return;active=i;const p=work[i];buttons.forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));img.classList.add('changing');const next=new Image();next.onload=()=>{if(active!==i)return;img.src=p.src;img.alt=p.alt;img.classList.remove('changing')};next.onerror=()=>{img.classList.remove('changing')};next.src=p.src;link.href=p.href;link.setAttribute('aria-label','Explore '+p.title+' work');caption.textContent=p.caption;meta.textContent=p.meta;current.textContent=p.title;explore.href=p.href}
buttons.forEach((b,i)=>{b.addEventListener('click',()=>{if(i===active){location.href=work[i].href}else{choose(i)}});b.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=(i+(e.key==='ArrowDown'?1:3))%4;choose(n);buttons[n].focus()}})});
})();
</script>
</body></html>
