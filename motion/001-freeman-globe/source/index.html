<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freeman Globe 001 — live preview</title>
<!-- Preview of the same frames render.cjs encodes. Serve the project folder over http:
       cd motion/001-freeman-globe && python3 -m http.server 8850   →  http://127.0.0.1:8850/source/
     Space pauses. ← → step one frame. L jumps to the loop seam. -->
<style>
  html,body{margin:0;height:100%;background:#1c1a16;display:grid;place-items:center}
  canvas{height:min(96vh,calc(96vw*16/9));aspect-ratio:9/16;image-rendering:pixelated;background:#fff9f1}
</style>
<canvas width="1080" height="1920" aria-label="The Freeman script held still in front of a turning red wireframe globe"></canvas>
<script src="mark.js"></script>
<script src="motion.js"></script>
<script>
(async () => {
  const src = await (await fetch("../assets/freeman-globe-mark.original.js")).text();
  const film = FreemanGlobe.create(FreemanMark.load(src)), S = film.SPEC;
  const ctx = document.querySelector("canvas").getContext("2d");
  function draw(frame) {
    const g = film.frameGrid(frame);
    ctx.fillStyle = S.paper; ctx.fillRect(0, 0, S.width, S.height);
    ctx.fillStyle = S.red;
    for (let y = 0; y < film.H; y++) for (let x = 0; x < film.W; x++)
      if (g[y * film.W + x]) ctx.fillRect(film.x0 + x * S.K, film.y0 + y * S.K, S.K, S.K);
  }
  let frame = 0, paused = false, t0 = performance.now();
  const tick = (now) => {
    if (!paused) { frame = Math.floor((now - t0) / 1000 * S.fps) % S.frames; draw(frame); }
    requestAnimationFrame(tick);
  };
  addEventListener("keydown", (e) => {
    if (e.key === " ") { paused = !paused; t0 = performance.now() - frame / S.fps * 1000; }
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { paused = true; frame = (frame + (e.key === "ArrowRight" ? 1 : S.frames - 1)) % S.frames; draw(frame); }
    else if (e.key.toLowerCase() === "l") { paused = true; frame = S.frames - 1; draw(frame); }
  });
  requestAnimationFrame(tick);
})();
</script>
